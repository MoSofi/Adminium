<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adminium</title>
    <!--
      NO WEBFONT LINKS HERE. 11-electron.md §7's fonts row: Manrope, JetBrains
      Mono and IBM Plex Sans Arabic ship as self-hosted woff2 in
      `@adminium/tokens` (02-design-system.md §2.4), reaching this page through
      `src/styles.css` → `@adminium/tokens/index.css` → `fonts.css`. A remote
      stylesheet here is unstyled text the moment the network is gone — which for
      the desktop build is "forever, by design".

      This head used to carry a Google Fonts stylesheet link and a gstatic
      preconnect, both written SCHEME-RELATIVE (no "https:", just the two
      slashes), pulling a font — Inter — that appears nowhere in the design
      system. `check-offline-assets.mjs` required a literal scheme in every
      pattern, so it never saw them: the gate whose entire purpose is this rule
      reported "ok" on every build while the shipped SPA asked Google for a
      stylesheet on every page load. It sees them now — including, deliberately,
      inside a comment like this one, which is why this paragraph spells no URL
      out. The scanner reads bytes, not syntax, and a shipped index.html's
      comments are bytes it is right not to trust.
    -->
    <!--
      Pre-hydration flash guard (02-design-system.md §4.3). This MUST be the
      first script, before any stylesheet paints content.

      SYNC NOTE: literal copy of `preHydrationScript` from
      packages/tokens/src/pre-hydration.ts — src/prehydration.test.ts asserts
      this inline copy matches the exported string byte-for-byte.
    -->
    <script>(function(){try{var d=document.documentElement,s=localStorage;var t=s.getItem("adminium-theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t);d.setAttribute("data-accent",s.getItem("adminium-accent")||"indigo");d.setAttribute("data-density",s.getItem("adminium-density")||"comfortable");var r=s.getItem("adminium-dir");if(r==="rtl")d.setAttribute("dir","rtl");var l=s.getItem("adminium-locale");if(l)d.setAttribute("lang",l.replace("_","-"))}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
