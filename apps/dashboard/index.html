<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adminium</title>
    <!--
      Pre-hydration flash guard (02-design-system.md §4.3). This MUST be the
      first script, before any stylesheet paints content.

      SYNC NOTE: literal copy of `preHydrationScript` from
      packages/tokens/src/pre-hydration.ts — src/prehydration.test.ts asserts
      this inline copy matches the exported string byte-for-byte.
    -->
    <script>(function(){try{var d=document.documentElement,s=localStorage;var t=s.getItem("adminium-theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t);d.setAttribute("data-accent",s.getItem("adminium-accent")||"indigo");d.setAttribute("data-density",s.getItem("adminium-density")||"comfortable");var r=s.getItem("adminium-dir");if(r==="rtl")d.setAttribute("dir","rtl");var l=s.getItem("adminium-locale");if(l)d.setAttribute("lang",l.replace("_","-"))}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
