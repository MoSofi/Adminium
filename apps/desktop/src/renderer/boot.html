<!doctype html>
<!--
  The splash page: the bundled logo (it moves), a line of text and the tokens from
  @adminium/tokens, working with zero network.

  ─── THE OFFLINE CONTRACT ─────────────────────────────────────────────────
  This page is shown BEFORE a server exists, so it cannot reach even loopback,
  let alone the internet. Everything it needs is on disk next to it:

    tokens.css   copied here at build time by electron.vite.config.ts's
                 copyTokenCss plugin. This is what "token CSS inlined" means; it is a
                 relative <link> to a COPY rather than an import because
                 .dependency-cruiser.cjs's `desktop-shell-only` rule bans the
                 shell from importing @adminium/tokens at all — "the boot/crash
                 splash pages get their CSS COPIED next to them at build time,
                 which is a file, not an import edge".
    everything   else is in the <style> block below. No <script> at all, no
                 <link> to any origin, no webfont.

  ─── NO WEBFONT, DELIBERATELY ────────────────────────────────────────────────
  Manrope, JetBrains Mono and IBM Plex Sans Arabic are self-hosted in @adminium/tokens,
  and the SPA uses them. This page does not, for two reasons. The narrow one:
  copyTokenCss copies fonts.css but NOT the src/fonts/ tree its ten @font-face
  rules point at, so linking it today fires ten file lookups that all miss and
  fall back to exactly the stack below (reported out of this track — the plugin
  is the shell's own file). The broad one: a splash is on screen for under a second, and
  blocking its only line of text on a font load — or flashing it when the font
  arrives — costs more than matching the SPA's typeface for that second buys. The
  system stack renders on the first frame, on every machine, forever.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No network is reachable here, so this CSP is not stopping an attack in
      progress — it stops this page from ever quietly acquiring a remote
      dependency. `default-src 'none'` means a <link>, <img> or fetch added later
      fails loudly in dev instead of shipping and turning up as an offline-smoke
 -test failure. `script-src 'none'`: this page has no script and never
      needs one. 'self' covers tokens.css — a sibling file on the same origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Adminium</title>
    <link rel="stylesheet" href="./tokens/tokens.css" />
    <style>
      /*
        tokens.css exposes its dark palette under [data-theme="dark"], which the
        SPA sets from the user's stored preference. This page has no script and
        no preference to read — it runs before the server that stores one — so it
        follows the OS instead. The values are pinned copies of tokens.css's dark
        block, and src/main/window.test.ts asserts they still match it, so this
        duplication cannot drift silently.
      */
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0a0a0d;
          --surface: #141419;
          --border: rgba(255, 255, 255, 0.07);
          --fg: #f4f4f6;
          --fg-muted: #b7b7c3;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        /* See the header: system stack, first frame, no fetch. */
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        /* A splash is not a document. */
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /*
        The logo, inline: the Adminium mark (table rows stacked into a capital
        A) on its forge tile, as the app's icon draws it. Inline markup cannot
        404, needs no img-src at load time, and adds no file that a packaging
        change could drop. The tile's colour is the brand's, not a token: this
        page is the app's own, shown before any workspace and its accent exist.

        IT MOVES, and it is the only thing that does. The rows are laid from the
        ground up, hold as the whole mark, and are laid again: a still square
        read as "paused" (owner, Windows walk, 2026-10-10), and a mark being
        built says both whose app this is and that it is working.
      */
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #b03e00;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
      }

      .mark svg {
        width: 36px;
        height: 36px;
        fill: #fff;
      }

      .mark rect {
        animation: lay 2s cubic-bezier(0.2, 0.7, 0.2, 1) infinite both;
      }

      /* From the ground up: the two feet, the bar, the cap. */
      .mark .row-1 {
        animation-delay: 0s;
      }
      .mark .row-2 {
        animation-delay: 0.12s;
      }
      .mark .row-3 {
        animation-delay: 0.3s;
      }
      .mark .row-4 {
        animation-delay: 0.48s;
      }

      @keyframes lay {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }
        22%,
        72% {
          opacity: 1;
          transform: translateY(0);
        }
        92%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }

      /*
        Vestibular safety, and not decorative here: this is the first thing the
        app ever renders, so it is the first chance it has to get this wrong. The
        mark still signals "working": its rows stay where they are and breathe.
      */
      @media (prefers-reduced-motion: reduce) {
        .mark rect {
          animation: pulse 1.6s ease-in-out infinite;
          animation-delay: 0s;
        }
      }

      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }

      .status {
        margin: 0;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <!--
      role="status" on the text, aria-hidden on the drawing: a screen reader
      announces "Starting Adminium" once rather than describing an animation.
      There is nothing to focus and nothing to do, which is the whole message.
    -->
    <main aria-busy="true">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <rect class="row-1" x="3.5" y="21.4" width="10.5" height="5.6" rx="2.2" />
          <rect class="row-2" x="18" y="21.4" width="10.5" height="5.6" rx="2.2" />
          <rect class="row-3" x="7.5" y="13.2" width="17" height="5.6" rx="2.2" />
          <rect class="row-4" x="11.5" y="5" width="9" height="5.6" rx="2.2" />
        </svg>
      </div>
      <p class="status" role="status">Starting Adminium…</p>
    </main>
  </body>
</html>
