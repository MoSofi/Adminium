<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adminium">
  <!--
 The 1024px icon master, owned by. This SVG is the
    ONLY checked-in icon source (apps/desktop/.gitignore ignores the derived
    *.icns/*.ico/*.png next to it); scripts/make-icons.mjs rasterizes it to every
 platform format. Keeping the source a vector is what makes "so accent
    changes re-derive cleanly" literally true.

    TWO COLORS ONLY, by contract. make-icons.mjs re-derives the icon for the
    active accent by string-substituting exactly these two hex values with the
    resolved @adminium/tokens colors before rasterizing — #b03e00 is the accent
 of [data-accent="orange"] (the brand's forge colour), and #ffffff is
    the accent-fg. Introduce a third colour and the substitution can no longer be
    scoped to a plain find-replace; don't. (Note: no CSS custom-property names in
    this comment — an XML comment may not contain a double hyphen, and a strict
    rasterizer like librsvg rejects the whole file if it does.)

    The mark: an accent app-tile carrying the Adminium mark, table rows stacked
    into a capital A. The same four rows as the website's logo and the product's
    own mark (packages/ui, AdminiumMark): its 32 grid, 20.8 times larger and
    centred, as the website's favicon places it (65 % of the tile).
  -->
  <rect x="0" y="0" width="1024" height="1024" rx="240" fill="#b03e00"/>
  <g fill="#ffffff" transform="translate(179.2 179.2) scale(20.8)">
    <rect x="11.5" y="5" width="9" height="5.6" rx="2.2"/>
    <rect x="7.5" y="13.2" width="17" height="5.6" rx="2.2"/>
    <rect x="3.5" y="21.4" width="10.5" height="5.6" rx="2.2"/>
    <rect x="18" y="21.4" width="10.5" height="5.6" rx="2.2"/>
  </g>
</svg>
