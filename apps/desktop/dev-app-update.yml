# Dev / test update feed (11-electron.md §11, 11-T16).
#
# A packaged build reads `app-update.yml`, which electron-builder generates from
# the electron-builder.yml `publish` block (11-T13). This file is its stand-in
# for the two contexts that have no generated one:
#
#   * `pnpm --filter @adminium/desktop dev`, where the app is unpacked and
#     electron-updater (with `forceDevUpdateConfig`) looks for THIS file next to
#     the app path instead;
#   * the updater test fixtures, which point a fake feed here rather than at the
#     network.
#
# It names the SAME MoSofi/Adminium repository the shipped app uses. It is NOT
# what resolves the release, though: `main/updates.ts` reads the releases list,
# picks the newest `desktop-v*` entry, and calls `setFeedURL` with a `generic`
# feed pinned to that release. `setFeedURL` assigns the provider eagerly, so this
# file is never consulted for the FEED. electron-updater still reads it in dev at
# download time (`updaterCacheDirName`), which is why it has to exist — not
# because anything reads it at construction.
#
# NOT `adminium/adminium`: that org+repo exists and belongs to an unrelated third
# party. Keep in lockstep with updates.ts FEED_REPO and electron-builder.yml
# `publish`.
provider: github
owner: MoSofi
repo: Adminium
