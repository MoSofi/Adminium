# electron-builder configuration — 11-electron.md §10, owned by 11-T13/11-T15.
#
# electron-builder auto-detects this file in the package directory; the packaging
# entry points are the `pack`/`dist` scripts in package.json (its only call site
# — a config no script invokes packages nothing). `directories.buildResources`
# defaults to `build/`, which is why `mac.entitlements` below and the icon
# masters resolve the way they do.
#
# ─── THE NATIVE-MODULE REBUILD (§2.1, the crux of M11) ───────────────────────
# better-sqlite3 and argon2 are native (.node) addons, and `asarUnpack` below is
# unconditionally required: a .node inside an asar cannot be dlopen'd, whatever
# produced it.
#
# THE ABI PROBLEM THIS SECTION WAS WRITTEN FOR IS GONE (2026-08-14). It used to
# read: the forked utilityProcess runs Electron's bundled Node, whose ABI
# (NODE_MODULE_VERSION) differs from the local Node every other suite runs at, so
# the workspace-shared prebuild could not be dlopen'd under Electron — hence
# @electron/rebuild via `npmRebuild: true`. That was true while both addons were
# built against V8/node internals. Both are now Node-API:
#
#   better-sqlite3 >= 13  — the v13 major migrated to N-API and ships prebuilds
#                           inside its own tarball (8 platform/arch variants).
#   argon2 >= 0.44        — declares `binary.napi_versions: [8]`, builds with
#                           `prebuildify --napi --tag-libc`, resolves via
#                           node-gyp-build.
#
# Verified by symbol inspection: each prebuild imports N-API entry points
# (napi_*) and references ZERO V8/node internals. An N-API binary is ABI-stable
# across Node AND Electron by definition, so there is no ABI to rewrite.
#
# THE TWO ADDONS NOW RESOLVE IN OPPOSITE ORDER — the detail that matters if you
# touch this:
#
#   better-sqlite3  lib/binding.js checks `prebuilds/<platform>-<arch>.node`
#                   FIRST and only falls back to build/Release. A rebuild here is
#                   therefore INERT: the compiled output is never loaded.
#   argon2          node-gyp-build checks `build/Release` FIRST (index.js:34),
#                   then `prebuilds/`. A rebuild here still WINS.
#
# So `npmRebuild: true` is at most redundant now, and for better-sqlite3 it is
# ignored outright. It is kept ON deliberately rather than flipped off in the
# same change that observed this: `desktop-e2e` is green with both addons on
# these versions, and turning the rebuild off is a packaging-pipeline change that
# deserves its own verified commit, not a drive-by edit to a comment.
#
# LOCAL RESTORE — no longer an ABI necessity. The old obligation was:
#
#   pnpm rebuild better-sqlite3 argon2      # from the repo root, after pack/dist
#
# It existed because the rebuild rewrote the pnpm-shared addon to Electron's ABI
# in place, breaking every Node-side suite (apps/server, apps/e2e, packages/meta,
# packages/adapter-sqlite) until restored. With N-API there is no incompatible
# ABI to strand: anything the rebuild produces is loadable by both runtimes.
# Harmless to run, no longer required. See apps/desktop/README.md "Packaging
# locally", which still documents it.
#
# WHERE THE REBUILD RUNS — corrected 2026-07-21, still accurate. This comment
# once claimed it operates on "electron-builder's STAGED, private copy of
# node_modules". It does not, and no such copy exists at that point.
# app-builder-lib's `installAppDependencies` calls `installOrRebuild(...,
# { appDir, ... })` and `rebuild()` forks @electron/rebuild with
# `buildPath: appDir` — appDir being the package directory being built, i.e.
# apps/desktop itself. The only staging electron-builder does (`appOutDir`)
# happens LATER, in doPack. So the rebuild walks apps/desktop/node_modules, whose
# better-sqlite3 and argon2 entries are pnpm symlinks into the workspace-shared
# node_modules/.pnpm/… store.
#
# This does NOT reopen the postinstall question: apps/desktop/package.json's
# //native-modules note still rules out a `postinstall` rebuild, because that
# would corrupt the shared addon on every `pnpm install` for everyone, not just
# for whoever deliberately ran a packaging command. Isolating the rebuild
# properly (a `pnpm deploy --filter @adminium/desktop` tree, which is a real
# non-symlinked node_modules, plus a beforeBuild hook returning false) is the
# real fix and is deliberately NOT taken here: it rewires the packaging pipeline
# on a release path that has never once executed end-to-end.

# THE APPLICATION IDENTITY. This is the macOS CFBundleIdentifier (and the basis
# of the Windows NSIS uninstall key / AppUserModelID and the Linux desktop-file
# name), so it is baked into code signing, notarization, and every per-user path
# and Keychain/registry entry the OS derives from it. It is effectively
# immutable once installers reach users: changing it later makes the OS treat
# the new build as a DIFFERENT application — orphaned app data, a second entry
# in Launchpad/Add-or-Remove-Programs, and an update that installs beside the
# old app instead of over it.
#
# `ai.adminium.desktop` — the value here until 2026-07-21 — was reverse-DNS for
# adminium.ai, a domain this project DROPPED and does not own (the domain sweep
# moved everything to adminium.dev). A bundle id under a domain someone else can
# register is a squatting and impersonation hazard, and it contradicts every
# other identity string in this package (homepage, author, maintainer). Changed
# to `dev.adminium.desktop` while the desktop release is still an unpublished
# draft — the last moment the change costs nothing.
appId: dev.adminium.desktop
productName: Adminium
artifactName: "adminium-${version}-${os}-${arch}.${ext}"

# asar on, but the two native addons unpacked next to it. `**/*.node` is the
# whole set (§10): better-sqlite3's build/Release/better_sqlite3.node and argon2's
# prebuilds. Anything dlopen'd at runtime must be a real file, not an asar entry.
asar: true
asarUnpack:
  - "**/*.node"

# Rebuild native deps — see the header. Both addons are N-API now, so this is
# redundant for argon2 and INERT for better-sqlite3 (its own binding.js prefers
# the bundled prebuild over build/Release), and there is no longer an ABI mismatch
# to correct. Left ON pending a verified change; if it is ever turned off, the
# `asarUnpack` above still is not optional.
#
# This remains the ONLY sanctioned home for an @electron/rebuild step; never a
# postinstall (apps/desktop/package.json //native-modules).
npmRebuild: true

# `out/**` is electron-vite's four bundles (main/server/preload/renderer) plus the
# copied dashboard build (out/dashboard). `resources/**` carries the demo seed
# (resources/demo/**, the §6 first-run demo DB — MUST ship), the generated
# THIRD-PARTY-NOTICES.txt + LICENSE (§13), and the derived icons. node_modules and
# package.json are always included by electron-builder (prod deps only), which is
# how the externalized @adminium/server and its computed-specifier deps — the
# adapters, drivers, native addons — reach the packaged app (§2.1, the app loads
# the same files `adminium start` does, resolved from apps/desktop/node_modules).
files:
  - "out/**"
  - "resources/**"

mac:
  category: public.app-category.developer-tools
  # dmg is the human download; zip is MANDATORY — electron-updater consumes the
  # zip, not the dmg (§10, §11). Both arches: Apple Silicon + Intel.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: resources/icons/icon.icns
  # Hardened runtime + notarization: a Developer ID IS owned (Open Decision 1),
  # so macOS is fully signed. `notarize: true` runs @electron/notarize from the
  # APPLE_API_KEY_* env (App Store Connect API key); signing reads the Developer
  # ID cert from CSC_LINK/CSC_KEY_PASSWORD. The entitlements withhold
  # allow-unsigned-executable-memory and grant no app sandbox — see the plist.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  target: [nsis]
  icon: resources/icons/icon.ico
  # WINDOWS SHIPS UNSIGNED FOR v1. No Windows certificate is owned (Open Decision
  # 1, DECIDED 2026-07-17), so `win.signtoolOptions` is ABSENT — its absence is
  # the structural signal that signing is off, matching the release workflow's
  # `if: env.WIN_CSC_LINK != ''` gate. Acquiring a cert later is a secrets change,
  # not a code change, and does not re-open the Azure-vs-OV/EV method decision
  # (either populates CSC_*/AZURE_*). The cost is a SmartScreen interstitial on
  # every download; the sha256 checksums file the release job ships is the only
  # integrity signal an unsigned installer has.
  #
  # §10's YAML lists `signingHashAlgorithms: [sha256]` directly under `win`; that
  # was valid on the electron-builder the doc was written against, but v26 — the
  # version this repo pins — moved it into `signtoolOptions` (WindowsConfiguration
  # is now additionalProperties:false), so a direct key here makes the whole
  # config schema-INVALID and a real `electron-builder` run aborts before it
  # builds. sha256 is also electron-builder's signing default, so it is inert
  # while unsigned. The intent is therefore honored, not dropped: it belongs at
  #   win.signtoolOptions.signingHashAlgorithms: [sha256]
  # and gets added there, next to the cert inputs, the day Windows signing is
  # enabled — a secrets-time change, exactly as the decision requires.

linux:
  target: [AppImage, deb, rpm]
  category: Development
  maintainer: Adminium <hello@adminium.dev>
  icon: resources/icons/icon.png
  # REQUIRED, not cosmetic. `executableName` defaults to package.json `name`,
  # which here is the scoped workspace name `@adminium/desktop`; electron-builder
  # flattens that to `@adminiumdesktop` and then refuses to build the AppImage
  # ("contains characters that cannot be safely used in file paths"). macOS and
  # Windows derive their binary from `productName` instead, which is why only the
  # Linux leg failed. This also fixes the command users actually type.
  executableName: adminium

# THE UPDATE FEED. electron-builder writes this block verbatim into the packaged
# app's Contents/Resources/app-update.yml (it does so even under `--publish
# never`), and it stamps the download URLs into the generated latest*.yml. So
# whatever repository is named here is what a SHIPPED install polls for its next
# executable — and on Windows, which ships unsigned for v1, electron-updater does
# not verify the downloaded installer's signature at all (NsisUpdater skips the
# check when `publisherName` is absent, and it is absent precisely because the
# build is unsigned). A wrong owner/repo is therefore a supply-chain hole.
#
# `adminium/adminium` — the value here until 2026-07-21 — is a REAL GitHub
# organisation and repository owned by an unrelated third party. The real
# repository is MoSofi/Adminium. KEEP THIS IN LOCKSTEP with
# apps/desktop/src/main/updates.ts (UPDATE_FEED) and apps/desktop/dev-app-update.yml;
# the generated app-update.yml is what wins in a packaged build, so this file
# disagreeing with updates.ts means updates.ts loses.
publish:
  provider: github
  owner: MoSofi
  repo: Adminium
  # Desktop tags are `desktop-vX.Y.Z` (§11), NOT `vX.Y.Z` — they interleave with
  # the monorepo's npm/Docker releases. Without this the GitHub provider would
  # look for a `v`-prefixed tag and never find the feed.
  vPrefixedTagName: false
