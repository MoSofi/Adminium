name: Bug report
description: Report a defect in Adminium
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Do NOT report security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I ..., Adminium ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug.
      placeholder: |
        1. Connect a Postgres database with ...
        2. Open ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Adminium version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Self-host (npx / node)
        - Docker
        - Desktop (Electron)
        - Cloud (adminium.app)
        - Development checkout
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Source database
      options:
        - PostgreSQL
        - MySQL / MariaDB
        - SQLite
        - Not database-related
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser — whatever is relevant.
      placeholder: |
        OS: macOS 15
        Node: 22.11.0
        Browser: Firefox 140
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs. Redact DSNs, secrets, and personal data.
      render: shell
