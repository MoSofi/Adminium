name: docs

# Builds apps/docs (Astro Starlight) on every docs change, and publishes it to
# GitHub Pages at https://docs.adminium.dev (astro.config.mjs `site`).
#
# GitHub Pages requires a PUBLIC repository on the free plan, so the deploy job
# is gated on repository visibility and arms itself automatically the moment
# the repo goes public. One-time setup on that day (repo-admin API calls the
# workflow token is not allowed to make):
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#   gh api -X PUT  repos/<owner>/<repo>/pages -f cname=docs.adminium.dev
# plus a DNS CNAME record: docs.adminium.dev -> <owner>.github.io
# A CNAME artifact file is unnecessary for Actions-based Pages deploys.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/tokens/**'
      - '.github/workflows/docs.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo build --filter=@adminium/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: deploy
    needs: build
    # Pages is unavailable while the repo is private (free plan); the build
    # above still validates every docs change. Flips on with repo visibility.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
