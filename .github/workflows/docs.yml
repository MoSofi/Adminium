name: docs

# Publishes apps/docs (Astro Starlight) to GitHub Pages, served at
# https://docs.adminium.dev (astro.config.mjs `site`). One-time repo setup:
# Settings → Pages → Source: "GitHub Actions", custom domain docs.adminium.dev
# (+ a DNS CNAME record pointing docs.adminium.dev at <owner>.github.io).
# A CNAME artifact file is unnecessary for Actions-based Pages deploys.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/tokens/**'
      - '.github/workflows/docs.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable GitHub Pages (first run) and read config
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo build --filter=@adminium/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
