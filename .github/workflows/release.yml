name: release

# Phase 1 (01-architecture.md §11, tasks 01-T12 / M10-T02): on a `v*` tag, build
# and push the multi-arch image to ghcr. The remaining release jobs land with
# their milestones: npm publish with provenance (01-T12), docs deploy (01-T14),
# and the Electron matrix with signing (01-T15, M11).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 1.2.3). Image is pushed as :<version>; :latest is NOT moved.'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # NO `IMAGE:` here on purpose. `github.repository` preserves the owner's case
  # (`MoSofi/Adminium`) and OCI repository names must be lowercase, so a
  # workflow-level constant would hand `ghcr.io/MoSofi/Adminium` to every step
  # that interpolates it — docker/metadata-action lowercases internally and
  # would hide the problem, while `docker run`, `imagetools create` and the
  # attestation subject would all fail on "repository name must be lowercase".
  # The reference is resolved ONCE, lowercased, as steps.version.outputs.image.
  #
  # The tag the image is published under BEFORE it has been smoke-tested. Never
  # referenced by docker-compose.yml or the docs; run-scoped so two releases
  # cannot collide on it.
  STAGING_TAG: staging-${{ github.run_id }}

jobs:
  # v1.0 gate (RELEASE-GATE.md): a v1+ tag may not publish while the checklist
  # has unchecked items. v0.x tags pass through untouched, so this job is a
  # no-op for the current release line — but every publish job needs it, which
  # is what makes the gate a gate.
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce RELEASE-GATE.md for v1+ tags
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          major="${VERSION#v}"
          major="${major%%.*}"
          parsed=
          case "$major" in
            ''|*[!0-9]*)
              echo "Unparseable version '$VERSION' — enforcing the gate to be safe." ;;
            0)
              echo "v0.x release — RELEASE-GATE.md not enforced."; exit 0 ;;
            *)
              parsed=1 ;;
          esac
          # A PRERELEASE (1.0.0-rc.1) reports but does not block.
          #
          # This gate used to fail prereleases exactly like a GA tag, which
          # deadlocked it against its own checklist: one row requires that "a
          # `v1.0.0-rc.*` rehearsal ran the full npm + ghcr + Releases
          # pipeline", and that rehearsal needs a v1 prerelease tag — which the
          # gate refused while any row was unchecked, that row included. A
          # rehearsal exists to run BEFORE the gate is green; blocking it on a
          # green gate inverts the order.
          #
          # Safe because the rest of this workflow is already prerelease-aware:
          # docker never moves `:latest` for a prerelease, the GitHub release
          # is created with `--prerelease`, and publish-npm.mjs ships
          # prereleases under the `next` dist-tag. A GA `v1.x` tag is still
          # hard-blocked below.
          # `parsed` is required: an UNPARSEABLE version can contain a hyphen
          # too ("not-a-version"), and without this it would be read as a
          # prerelease and skip the gate — the opposite of the "enforce to be
          # safe" rule above.
          case "$VERSION" in
            *-*) prerelease="$parsed" ;;
            *) prerelease= ;;
          esac

          # ANCHORED on purpose. An unanchored `- [ ]` also matched this
          # file's own PROSE — the sentence explaining that an unchecked
          # `- [ ]` item blocks a release is itself an unchecked-looking
          # match — so the gate could never go green no matter how many real
          # rows were ticked, and nobody would find out until the GA tag.
          # `^[[:space:]]*- \[ \]` matches list items (indented ones too) and
          # not descriptions of them.
          unchecked="$(grep -nE '^[[:space:]]*- \[ \]' RELEASE-GATE.md || true)"
          if [ -n "$unchecked" ] && [ -n "$prerelease" ]; then
            echo "RELEASE-GATE.md still has unchecked items. This is a PRERELEASE,"
            echo "so the rehearsal proceeds — GA stays blocked until these close:"
            echo "$unchecked"
            exit 0
          fi
          if [ -n "$unchecked" ]; then
            echo "RELEASE-GATE.md still has unchecked items — a v1+ tag cannot publish:"
            echo "$unchecked"
            exit 1
          fi
          echo "RELEASE-GATE.md is fully checked."

  docker:
    name: docker
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to ghcr.io and record build provenance against the repo.
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A tag push carries the version in the ref; workflow_dispatch takes it as
      # an input. Everything downstream reads steps.version.outputs.version, so
      # the two triggers converge here rather than in each tag expression.
      #
      # This step also resolves the image reference — lowercased, once — for the
      # same reason: every consumer below (metadata-action, the smoke tests, the
      # compose stack, the attestation subject, both promote calls) must name
      # the exact same repository, and `github.repository` is not a legal OCI
      # path on its own.
      - name: Resolve version and image reference
        id: version
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image reference: $image"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            latest=false
          else
            version="${GITHUB_REF_NAME#v}"
            latest=true
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version (expected tag v<major>.<minor>.<patch>)"
            exit 1
          fi
          # A prerelease (1.0.0-rc.1) must never move :latest.
          case "$version" in *-*) latest=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Building $version (move :latest = $latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          # NO tags here. See the next step: the release tags are applied only
          # after the smoke test passes.
          tags: |
            type=raw,value=${{ env.STAGING_TAG }}
          labels: |
            org.opencontainers.image.title=Adminium
            org.opencontainers.image.description=Open-source admin panel generator
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ── Publish BY DIGEST, under a throwaway tag ─────────────────────────────
      #
      # The release tags (`:<version>` and `:latest`) are NOT applied here. They
      # used to be, with the smoke test running afterwards — which meant a
      # regression that only shows at runtime was already public by the time CI
      # went red, and a failed smoke test could not un-publish it. `:latest`
      # would have moved to a broken image, and docker-compose.yml defaults to
      # `${ADMINIUM_VERSION:-latest}`, so every `docker compose up` in the wild
      # would pull it. The job went red and the release stayed shipped.
      #
      # So: push a staging tag, smoke-test THAT digest, and only then move the
      # real tags onto the digest that passed (the "Promote" step below).
      - name: Build and push staging image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # §4.2: multi-arch. The native modules (better-sqlite3, argon2) are
          # compiled per-platform inside the build stage — arm64 goes through
          # QEMU, hence the generous timeout above.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The exit criterion for M10-T02 is "docker run boots to the first-run
      # wizard" — assert it against the built image rather than trusting a green
      # build. Boots with no meta store configured (embedded SQLite fallback),
      # which is exactly the clean-machine first-run path. This leg is amd64
      # (the runner's native architecture); arm64 gets its own leg below.
      #
      # This runs against the DIGEST, before any release tag points at it.
      - name: Smoke-test the staged image
        run: |
          set -euo pipefail
          IMAGE_REF='${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}'
          docker run -d --name adminium-smoke \
            -e ADMINIUM_SECRET=smoke-test-secret-not-a-real-one \
            -p 4600:4600 "$IMAGE_REF"

          # Wait for Docker's own HEALTHCHECK to report healthy — that also
          # proves the healthcheck itself works, not just the server.
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' adminium-smoke 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ] || [ "$i" -eq 60 ]; then
              echo "::error::container did not become healthy (status=$status)"
              docker logs adminium-smoke
              exit 1
            fi
            sleep 2
          done

          # The API is alive...
          curl -fsS http://127.0.0.1:4600/api/v1/healthz | grep -q '"ok":true'
          # ...and the dashboard build is actually bundled, so the wizard renders
          # rather than 404ing (the bundle-dashboard step in the Dockerfile).
          curl -fsS http://127.0.0.1:4600/ | grep -qi '<!doctype html'

          # Non-root (§4.2).
          uid="$(docker exec adminium-smoke id -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi
          echo "Smoke test passed: healthy, API up, SPA served, running as uid $uid"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs adminium-smoke || true

      - name: Clean up the smoke container
        if: always()
        run: docker rm -f adminium-smoke || true

      # ── The OTHER half of the manifest ───────────────────────────────────────
      #
      # The build above ships linux/amd64 AND linux/arm64, and the Dockerfile
      # compiles better-sqlite3 and argon2 from source per target platform — so
      # arm64 is a genuinely different artifact, not a repack. Every smoke test
      # in this repo runs on an x86 runner without `--platform`, which means
      # Docker always resolved the amd64 manifest and the arm64 image was
      # promoted onto `:latest` having never been booted once. Apple Silicon and
      # Graviton self-hosters would have been the ones to find out.
      #
      # QEMU is already installed for the build, so this costs a boot, not a
      # toolchain. Emulated startup is several times slower than native, hence
      # the longer wait. The assertions are deliberately narrow: if the native
      # modules failed to load for this architecture the process dies before it
      # ever listens, so "healthy + healthz + arch is arm64" is the whole proof.
      - name: Smoke-test the arm64 half of the staged manifest
        run: |
          set -euo pipefail
          IMAGE='${{ steps.version.outputs.image }}'
          INDEX_DIGEST='${{ steps.build.outputs.digest }}'

          # `docker run --platform linux/arm64 img@<index digest>` fails with
          # "cannot overwrite digest": the build output is the digest of the
          # multi-arch INDEX, and once Docker resolves the index to a
          # per-architecture child it cannot honour the pinned index digest for
          # the container it is actually running. So resolve the arm64 child
          # ourselves and run THAT by digest — no --platform needed, and it
          # proves the exact artifact inside the index we are about to promote.
          ARM64_DIGEST="$(docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and (.platform.variant // "") != "unknown") | .digest' \
            | head -n1)"
          if [ -z "$ARM64_DIGEST" ]; then
            echo "::error::no linux/arm64 manifest inside $IMAGE@$INDEX_DIGEST"
            docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw
            exit 1
          fi
          echo "arm64 child manifest: $ARM64_DIGEST"

          # The image's baked HEALTHCHECK (--start-period=40s --interval=30s
          # --retries=3) declares a container unhealthy ~130s in, and the loop
          # below aborts on the first `unhealthy` — so under QEMU the 240s
          # budget was unreachable and this leg would fail on a HEALTHY image.
          # Widen the probe for the emulated run only; the baked values still
          # govern real deployments.
          docker run -d --name adminium-smoke-arm64 \
            --health-start-period=180s --health-interval=5s --health-retries=12 \
            -e ADMINIUM_SECRET=smoke-test-secret-not-a-real-one \
            -p 4601:4600 "$IMAGE@$ARM64_DIGEST"

          for i in $(seq 1 120); do
            status="$(docker inspect -f '{{.State.Health.Status}}' adminium-smoke-arm64 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ] || [ "$i" -eq 120 ]; then
              echo "::error::arm64 container did not become healthy (status=$status)"
              docker logs adminium-smoke-arm64
              exit 1
            fi
            sleep 2
          done

          # It really is the arm64 image that just booted, not the amd64 one
          # silently selected from the index.
          arch="$(docker exec adminium-smoke-arm64 node -p 'process.arch')"
          if [ "$arch" != "arm64" ]; then
            echo "::error::expected an arm64 container, got process.arch=$arch"
            exit 1
          fi

          curl -fsS http://127.0.0.1:4601/api/v1/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:4601/ | grep -qi '<!doctype html'
          echo "arm64 smoke test passed: native modules loaded, API up, SPA served"

      - name: Container logs, arm64 (on failure)
        if: failure()
        run: docker logs adminium-smoke-arm64 || true

      - name: Clean up the arm64 smoke container
        if: always()
        run: docker rm -f adminium-smoke-arm64 || true

      # §4.2's production shape: a SEPARATE Postgres meta store. Never exercised
      # by CI before — every smoke test set only ADMINIUM_SECRET, i.e. the
      # embedded SQLite fallback §3.1 tells self-hosters not to rely on. So the
      # one meta store the docs tell people to use was the one nobody proved
      # boots, and a missing `pg` in the image would have shipped behind two
      # green smoke tests.
      #
      # ADMINIUM_IMAGE is what makes this test the compose file the docs ship,
      # rather than a copy of it: docker-compose.yml defaults the repository to
      # the published image and lets CI override it, so the staged digest is
      # exercised through the exact service definition self-hosters run.
      - name: Smoke-test the staged image against a Postgres meta store
        env:
          ADMINIUM_IMAGE: ${{ steps.version.outputs.image }}
          ADMINIUM_VERSION: ${{ env.STAGING_TAG }}
          ADMINIUM_SECRET: smoke-test-secret-not-a-real-one
          ADMINIUM_META_URL: postgres://adminium:adminium@meta-db:5432/adminium
        run: |
          set -euo pipefail
          docker compose --profile with-meta up -d --wait --wait-timeout 180
          # The image must have actually USED Postgres — if `pg` were missing it
          # would either crash-loop or (worse) look fine on the fallback.
          docker compose logs adminium | grep -qi 'embedded SQLite' && {
            echo "::error::fell back to embedded SQLite despite ADMINIUM_META_URL"
            exit 1
          }
          dialect="$(curl -fsS http://127.0.0.1:4600/api/v1/system/info)"
          echo "$dialect" | grep -q '"dialect":"postgres"' || {
            echo "::error::meta dialect is not postgres: $dialect"
            exit 1
          }
          # Readiness must agree that the store it is actually using is up.
          curl -fsS http://127.0.0.1:4600/api/v1/readyz | grep -q '"meta":"ok"'
          # And the schema must really be there: the wizard is the exit criterion.
          curl -fsS http://127.0.0.1:4600/api/v1/setup/state | grep -q '"required":true'
          echo "with-meta smoke test passed: postgres meta store, migrated, wizard reachable"

      # ADMINIUM_SECRET is required here too: compose interpolates the whole
      # file before dispatching ANY subcommand, and docker-compose.yml declares
      # the secret with `:?`, so `compose logs` without it aborts on the
      # interpolation error and prints no container logs at all — precisely when
      # they are needed. Same reason ADMINIUM_IMAGE is set: without it compose
      # would resolve a different service image than the one that just failed.
      - name: Compose logs (on failure)
        if: failure()
        env:
          ADMINIUM_IMAGE: ${{ steps.version.outputs.image }}
          ADMINIUM_VERSION: ${{ env.STAGING_TAG }}
          ADMINIUM_SECRET: smoke-test-secret-not-a-real-one
        run: docker compose --profile with-meta logs || true

      - name: Clean up the compose stack
        if: always()
        env:
          ADMINIUM_IMAGE: ${{ steps.version.outputs.image }}
          ADMINIUM_VERSION: ${{ env.STAGING_TAG }}
          ADMINIUM_SECRET: smoke-test-secret-not-a-real-one
        run: docker compose --profile with-meta down -v || true

      # Attest AFTER the smoke tests — never vouch for an image that has not
      # booted. GitHub's attestation API rejects user-owned PRIVATE repos
      # ("Feature not available…"), which failed the first v0.1.0 release, so
      # the step is gated on visibility and arms itself when the repo is
      # public. Provenance is a supply-chain guarantee, not a formality: when
      # it can run and fails, the release stops here.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Note skipped attestation
        if: ${{ github.event.repository.private }}
        run: echo 'Repository is private — build provenance attestation skipped (GitHub does not support it for user-owned private repos).'

      # ── Only now is the image allowed to be a release ────────────────────────
      # Digest-addressed, so what gets tagged is byte-identical to what passed
      # above. If any step before this failed, the job stops here and `:latest`
      # never moves — the whole point of the split.
      - name: Promote the tested digest to :<version> (and :latest)
        run: |
          set -euo pipefail
          DIGEST='${{ steps.build.outputs.digest }}'
          IMAGE='${{ steps.version.outputs.image }}'
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ steps.version.outputs.version }}" \
            "${IMAGE}@${DIGEST}"
          echo "tagged :${{ steps.version.outputs.version }} → ${DIGEST}"
          if [ '${{ steps.version.outputs.latest }}' = 'true' ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}@${DIGEST}"
            echo "moved :latest → ${DIGEST}"
          else
            echo ":latest not moved (prerelease or workflow_dispatch)"
          fi

  npm:
    name: npm
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishes every public package under the scope-mapped identity
    # (scripts/release/publish-npm.mjs — @adminiumjs/* until the @adminium
    # scope dispute settles; flip NPM_SCOPE to republish).
    #
    # AUTH IS TRUSTED PUBLISHING (OIDC), NOT A TOKEN. npm exchanges the Actions
    # OIDC token for a short-lived credential, so there is no NPM_TOKEN secret
    # to expire, leak, or create at the wrong type — which is every way this
    # job has failed so far: v0.1.1 died on E404 (a revoked token) and the
    # first v0.1.2 attempt on EOTP (a classic "Publish" token, which demands an
    # interactive 2FA code no CI run can supply).
    #
    # EVERY published package must name this repository AND this workflow's
    # FILENAME (release.yml) as a trusted publisher in its npmjs.com settings.
    # Renaming this file breaks every publish until each is repointed.
    #
    # A NEW package cannot be published by this job on its first release. npm
    # can only configure a trusted publisher on a package that already exists,
    # and there is no scope-level inheritance — so a name that has never been
    # published has nowhere to hold the config. The OIDC exchange 404s, npm
    # falls back to conventional auth, finds none, and the run dies at the
    # upload with ENEEDAUTH or a misleading E404. Because publish-npm.mjs
    # uploads in topological order with no rollback, that abort can land after
    # earlier packages are already immutable on the registry.
    #
    # So: a brand-new package must be published ONCE by hand before its first
    # tagged release — from the tarball `publish-npm.mjs --dry-run` validates,
    # never a bare `npm publish` from the package directory, which would ship
    # unresolved `catalog:`/`workspace:` ranges — and then registered with
    # `npm trust github <pkg> --file release.yml`. Subsequent releases go
    # through OIDC like every other package, and the script's alreadyPublished()
    # check makes the bootstrapped version a no-op SKIP on the tagged run.
    #
    # There is deliberately no "skip if unconfigured" branch. The probe step
    # this replaces exited GREEN when NPM_TOKEN was missing, so a release that
    # published nothing looked identical to one that succeeded. A release job
    # that cannot publish must go red.
    #
    # TAG PUSHES ONLY. workflow_dispatch exists to rebuild an IMAGE for a
    # version that already shipped; it checks out the default branch and its
    # `version` input is read by the docker job alone. Left ungated, a manual
    # image rebuild would publish whatever versions main's package.json files
    # happen to carry — unreleased changesets bumps included — as an
    # irreversible npm publish nobody asked for.
    if: github.event_name == 'push'
    permissions:
      contents: read
      # The OIDC token npm exchanges for its publish credential. Without it npm
      # silently falls back to token auth and fails needing credentials that no
      # longer exist.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14, which the
      # line above already satisfies). Node 22 bundles npm 10.9.x, which has no
      # OIDC support at all — it ignores the token above, falls back to reading
      # an auth token that is no longer set, and fails. This step is what makes
      # the whole job work; it is not housekeeping.
      #
      # Ranged rather than @latest so a future npm major cannot change publish
      # behaviour underneath a release without a deliberate bump here.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      # The manifests on disk are what actually gets published — publish-npm.mjs
      # reads each package's own `version` and never looks at the ref. If the
      # tag and the manifests disagree, the registry gets a version nobody
      # tagged and npm has no undo. Assert they match before anything is pushed.
      - name: Assert the manifest version matches the tag
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./apps/server/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version '$tag_version' but apps/server/package.json is '$pkg_version' — refusing to publish"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Publishing $pkg_version (matches $GITHUB_REF_NAME)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # No NODE_AUTH_TOKEN and no NPM_PROVENANCE. Both are now handled by
      # trusted publishing: npm authenticates via the OIDC token, and it
      # generates and publishes provenance automatically on that path, so
      # passing --provenance explicitly would be redundant. publish-npm.mjs
      # keeps honouring NPM_PROVENANCE for anyone publishing by hand.
      - name: Publish
        run: node scripts/release/publish-npm.mjs

      - name: Smoke test the published CLI
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm-global"
          VERSION='${{ steps.version.outputs.version }}'

          # DERIVED, not maintained. This roster used to be a literal list of
          # fourteen names, and it drifted the moment a fifteenth package
          # existed: `@adminium/add-on-contracts` shipped as part of 0.2.0 and
          # was absent here, so the one genuinely NEW name in that release —
          # precisely the case the wait below exists for — was the only one
          # nobody waited on. Worse, the loop can only count what it lists, so
          # the gap could never raise `missing`: it printed success over an
          # unverified package. Deriving the list from the workspace with the
          # same rule publish-npm.mjs uses (non-private `@adminium/*` under
          # packages/ and apps/, with server -> adminium) means the next new
          # package cannot fall out of this gate.
          PKGS="$(node -e '
            const { readdirSync, readFileSync, existsSync } = require("fs");
            const { join } = require("path");
            const out = [];
            for (const group of ["packages", "apps"]) {
              for (const e of readdirSync(group, { withFileTypes: true })) {
                if (!e.isDirectory()) continue;
                const m = join(group, e.name, "package.json");
                if (!existsSync(m)) continue;
                const p = JSON.parse(readFileSync(m, "utf8"));
                if (p.private === true) continue;
                if (!p.name || !p.name.startsWith("@adminium/")) continue;
                const short = p.name.slice("@adminium/".length);
                out.push(short === "server" ? "adminium" : short);
              }
            }
            if (!out.length) { console.error("no publishable workspaces found"); process.exit(1); }
            console.log(out.join(" "));
          ')"
          COUNT="$(printf '%s' "$PKGS" | wc -w | tr -d ' ')"
          echo "waiting on $COUNT packuments: $PKGS"

          # A BRAND-NEW package name takes minutes to become readable across
          # npm's replicas — the 0.1.0-rc.1 rehearsal published every package
          # correctly and then failed here purely because 5×15s of retries ran
          # out first. Wait on the registry before spending an install attempt.
          #
          # Poll the PACKUMENT and look for the version inside `.versions`,
          # NOT the per-version document. They are served by different replicas
          # and the version doc wins the race: at v0.1.0 every
          # `/@scope%2Fpkg/0.1.0` returned 200 while `npm install` still failed
          # ETARGET, because the resolver reads the packument's version map.
          # Checking what the installer actually reads is the whole point.
          for i in $(seq 1 30); do
            missing=0
            for p in $PKGS; do
              curl -fsS -H 'Cache-Control: no-cache' \
                "https://registry.npmjs.org/@adminiumjs%2F$p" 2>/dev/null \
                | jq -e --arg v "$VERSION" '.versions[$v] // empty' >/dev/null 2>&1 \
                || missing=$((missing + 1))
            done
            [ "$missing" -eq 0 ] && { echo "all $COUNT packuments list $VERSION"; break; }
            if [ "$i" -eq 30 ]; then
              echo "::error::$missing packument(s) still missing $VERSION after 10 minutes"
              exit 1
            fi
            echo "waiting for the registry ($missing packuments lack $VERSION, attempt $i)"
            sleep 20
          done

          # --prefer-online: the runner may already have negative-cached these
          # names from the readiness poll above.
          npm install -g --prefer-online "@adminiumjs/adminium@$VERSION"
          "$NPM_CONFIG_PREFIX/bin/adminium" --version

          # The install is only meaningful if the aliases resolved and the SPA
          # actually shipped — a CLI that boots without its dashboard is the
          # hollow-package failure this pipeline exists to catch.
          PKG="$NPM_CONFIG_PREFIX/lib/node_modules/@adminiumjs/adminium"
          test -f "$PKG/dashboard/index.html" || {
            echo "::error::published CLI has no bundled dashboard"; exit 1; }
          for dep in engine meta widgets llm; do
            test -d "$PKG/node_modules/@adminium/$dep" || {
              echo "::error::alias @adminium/$dep did not resolve"; exit 1; }
          done
          echo "dashboard + aliased dependencies verified in the published package"

          # The CLI's dependency closure does NOT include @adminium/manifest
          # (it pulls engine, i18n, llm, meta, schema-import and the adapters),
          # so the check above can never exercise manifest's own alias — and
          # manifest is the only consumer of @adminium/add-on-contracts. That
          # left the newest package in the release, and the newest alias edge,
          # verified by nothing at all. Install manifest on its own and prove
          # the edge resolves the way a consumer would meet it.
          MANIFEST_DIR="$RUNNER_TEMP/manifest-probe"
          rm -rf "$MANIFEST_DIR" && mkdir -p "$MANIFEST_DIR"
          ( cd "$MANIFEST_DIR" \
            && npm init -y >/dev/null 2>&1 \
            && npm install --prefer-online "@adminiumjs/manifest@$VERSION" >/dev/null )
          test -d "$MANIFEST_DIR/node_modules/@adminium/add-on-contracts" || {
            echo "::error::alias @adminium/add-on-contracts did not resolve under @adminiumjs/manifest"
            exit 1; }
          # Dynamic import, not createRequire: @adminiumjs/manifest is ESM-only
          # ("type": "module", a single ./dist/index.js export), so require()
          # would depend on Node 22.12+'s require(esm) support resolving the
          # way we hope. `addOnManifestSchema` is the symbol manifest gained
          # FROM add-on-contracts, so importing it proves the alias edge is
          # loadable at runtime, not merely present on disk.
          ( cd "$MANIFEST_DIR" && node --input-type=module -e "
              const m = await import('@adminiumjs/manifest');
              if (typeof m.addOnManifestSchema === 'undefined') {
                throw new Error('@adminiumjs/manifest loaded but addOnManifestSchema is missing');
              }
              console.log('manifest resolves and imports its add-on-contracts edge');
            " )

  github-release:
    name: github release
    needs: [docker, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only for real tag pushes: a workflow_dispatch rebuild must not mint a
    # Release for a version that was already announced.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag

      # WHY THIS JOB EXISTS. `apps/server/src/telemetry/update-check.ts` polls
      # /releases/latest, and the in-app Changelog's "all releases" link points
      # at the Releases page. With no Release published, the opt-in update check
      # 404s forever and the link opens an empty page — the feature silently
      # never works. v0.1.0 shipped to npm and ghcr with no Release at all.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          case "$VERSION" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE \
            --notes-start-tag "$(git tag -l 'v*' --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)" \
            || gh release create "$TAG" --title "$VERSION" --generate-notes --verify-tag $PRERELEASE
          echo "Published Release $TAG"
