name: release

# Phase 1 (01-architecture.md §11, tasks 01-T12 / M10-T02): on a `v*` tag, build
# and push the multi-arch image to ghcr. The remaining release jobs land with
# their milestones: npm publish with provenance (01-T12), docs deploy (01-T14),
# and the Electron matrix with signing (01-T15, M11).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. 1.2.3). Image is pushed as :<version>; :latest is NOT moved.'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  IMAGE: ghcr.io/${{ github.repository }}
  # The tag the image is published under BEFORE it has been smoke-tested. Never
  # referenced by docker-compose.yml or the docs; run-scoped so two releases
  # cannot collide on it.
  STAGING_TAG: staging-${{ github.run_id }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to ghcr.io and record build provenance against the repo.
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag push carries the version in the ref; workflow_dispatch takes it as
      # an input. Everything downstream reads steps.version.outputs.version, so
      # the two triggers converge here rather than in each tag expression.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            latest=false
          else
            version="${GITHUB_REF_NAME#v}"
            latest=true
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semver version (expected tag v<major>.<minor>.<patch>)"
            exit 1
          fi
          # A prerelease (1.0.0-rc.1) must never move :latest.
          case "$version" in *-*) latest=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Building $version (move :latest = $latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # NO tags here. See the next step: the release tags are applied only
          # after the smoke test passes.
          tags: |
            type=raw,value=${{ env.STAGING_TAG }}
          labels: |
            org.opencontainers.image.title=Adminium
            org.opencontainers.image.description=Open-source admin panel generator
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ── Publish BY DIGEST, under a throwaway tag ─────────────────────────────
      #
      # The release tags (`:<version>` and `:latest`) are NOT applied here. They
      # used to be, with the smoke test running afterwards — which meant a
      # regression that only shows at runtime was already public by the time CI
      # went red, and a failed smoke test could not un-publish it. `:latest`
      # would have moved to a broken image, and docker-compose.yml defaults to
      # `${ADMINIUM_VERSION:-latest}`, so every `docker compose up` in the wild
      # would pull it. The job went red and the release stayed shipped.
      #
      # So: push a staging tag, smoke-test THAT digest, and only then move the
      # real tags onto the digest that passed (the "Promote" step below).
      - name: Build and push staging image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # §4.2: multi-arch. The native modules (better-sqlite3, argon2) are
          # compiled per-platform inside the build stage — arm64 goes through
          # QEMU, hence the generous timeout above.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The exit criterion for M10-T02 is "docker run boots to the first-run
      # wizard" — assert it against the built amd64 image rather than trusting a
      # green build. Boots with no meta store configured (embedded SQLite
      # fallback), which is exactly the clean-machine first-run path.
      #
      # This runs against the DIGEST, before any release tag points at it.
      - name: Smoke-test the staged image
        run: |
          set -euo pipefail
          IMAGE_REF='${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
          docker run -d --name adminium-smoke \
            -e ADMINIUM_SECRET=smoke-test-secret-not-a-real-one \
            -p 4600:4600 "$IMAGE_REF"

          # Wait for Docker's own HEALTHCHECK to report healthy — that also
          # proves the healthcheck itself works, not just the server.
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' adminium-smoke 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ] || [ "$i" -eq 60 ]; then
              echo "::error::container did not become healthy (status=$status)"
              docker logs adminium-smoke
              exit 1
            fi
            sleep 2
          done

          # The API is alive...
          curl -fsS http://127.0.0.1:4600/api/v1/healthz | grep -q '"ok":true'
          # ...and the dashboard build is actually bundled, so the wizard renders
          # rather than 404ing (the bundle-dashboard step in the Dockerfile).
          curl -fsS http://127.0.0.1:4600/ | grep -qi '<!doctype html'

          # Non-root (§4.2).
          uid="$(docker exec adminium-smoke id -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi
          echo "Smoke test passed: healthy, API up, SPA served, running as uid $uid"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs adminium-smoke || true

      - name: Clean up the smoke container
        if: always()
        run: docker rm -f adminium-smoke || true

      # §4.2's production shape: a SEPARATE Postgres meta store. Never exercised
      # by CI before — every smoke test set only ADMINIUM_SECRET, i.e. the
      # embedded SQLite fallback §3.1 tells self-hosters not to rely on. So the
      # one meta store the docs tell people to use was the one nobody proved
      # boots, and a missing `pg` in the image would have shipped behind two
      # green smoke tests.
      - name: Smoke-test the staged image against a Postgres meta store
        env:
          ADMINIUM_VERSION: ${{ env.STAGING_TAG }}
          ADMINIUM_SECRET: smoke-test-secret-not-a-real-one
          ADMINIUM_META_URL: postgres://adminium:adminium@meta-db:5432/adminium
        run: |
          set -euo pipefail
          docker compose --profile with-meta up -d --wait --wait-timeout 180
          # The image must have actually USED Postgres — if `pg` were missing it
          # would either crash-loop or (worse) look fine on the fallback.
          docker compose logs adminium | grep -qi 'embedded SQLite' && {
            echo "::error::fell back to embedded SQLite despite ADMINIUM_META_URL"
            exit 1
          }
          dialect="$(curl -fsS http://127.0.0.1:4600/api/v1/system/info)"
          echo "$dialect" | grep -q '"dialect":"postgres"' || {
            echo "::error::meta dialect is not postgres: $dialect"
            exit 1
          }
          # Readiness must agree that the store it is actually using is up.
          curl -fsS http://127.0.0.1:4600/api/v1/readyz | grep -q '"meta":"ok"'
          # And the schema must really be there: the wizard is the exit criterion.
          curl -fsS http://127.0.0.1:4600/api/v1/setup/state | grep -q '"required":true'
          echo "with-meta smoke test passed: postgres meta store, migrated, wizard reachable"

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose --profile with-meta logs || true

      - name: Clean up the compose stack
        if: always()
        env:
          ADMINIUM_SECRET: smoke-test-secret-not-a-real-one
        run: docker compose --profile with-meta down -v || true

      # ── Only now is the image allowed to be a release ────────────────────────
      # Digest-addressed, so what gets tagged is byte-identical to what passed
      # above. If any step before this failed, the job stops here and `:latest`
      # never moves — the whole point of the split.
      - name: Promote the tested digest to :<version> (and :latest)
        run: |
          set -euo pipefail
          DIGEST='${{ steps.build.outputs.digest }}'
          docker buildx imagetools create \
            --tag '${{ env.IMAGE }}:${{ steps.version.outputs.version }}' \
            "${{ env.IMAGE }}@${DIGEST}"
          echo "tagged :${{ steps.version.outputs.version }} → ${DIGEST}"
          if [ '${{ steps.version.outputs.latest }}' = 'true' ]; then
            docker buildx imagetools create \
              --tag '${{ env.IMAGE }}:latest' \
              "${{ env.IMAGE }}@${DIGEST}"
            echo "moved :latest → ${DIGEST}"
          else
            echo ":latest not moved (prerelease or workflow_dispatch)"
          fi

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Publishes the 14 public packages under the scope-mapped identity
    # (scripts/release/publish-npm.mjs — @adminiumjs/* until the @adminium
    # scope dispute settles; flip NPM_SCOPE to republish). The secrets context
    # is unavailable in job-level `if`, so a probe step gates each real step:
    # without an NPM_TOKEN secret the job logs and exits green.
    permissions:
      contents: read
      id-token: write # npm --provenance attestation
    steps:
      - name: Probe for NPM_TOKEN
        id: token
        run: |
          if [ -n '${{ secrets.NPM_TOKEN }}' ]; then
            echo 'have=true' >> "$GITHUB_OUTPUT"
          else
            echo 'have=false' >> "$GITHUB_OUTPUT"
            echo 'NPM_TOKEN secret not set — skipping npm publish.'
          fi

      - name: Checkout
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.token.outputs.have == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        if: steps.token.outputs.have == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.token.outputs.have == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.token.outputs.have == 'true'
        run: pnpm turbo build

      - name: Publish
        if: steps.token.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: '1'
        run: node scripts/release/publish-npm.mjs

      - name: Smoke test the published CLI
        if: steps.token.outputs.have == 'true'
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm-global"
          VERSION="$(node -p "require('./apps/server/package.json').version")"
          for i in 1 2 3 4 5; do
            if npm install -g "@adminiumjs/adminium@$VERSION"; then break; fi
            echo "registry not consistent yet, retry $i"; sleep 15
          done
          "$NPM_CONFIG_PREFIX/bin/adminium" --version
