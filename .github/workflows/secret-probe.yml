name: secret-probe

# TEMPORARY diagnostic — delete after use. Reports only the LENGTH of the
# NPM_TOKEN secret (never its value) to distinguish "secret stored empty" from
# "secret not reaching the workflow".

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret length only
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "length: ${#TOKEN}"
          case "$TOKEN" in
            npm_*) echo "prefix: looks like an npm token" ;;
            '') echo "prefix: EMPTY" ;;
            *) echo "prefix: present but does not start with npm_" ;;
          esac
