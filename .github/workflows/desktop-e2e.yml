name: desktop-e2e

# 11-T20 (11-electron.md §7 + acceptance criteria): the Playwright `_electron`
# suite that launches the BUILT desktop app and walks first-run → demo → CRUD →
# chart → backup, the §7 offline smoke (session.webRequest deny-all), and the §9
# crash/WAL-durability check.
#
# It cannot run in the ordinary `pnpm test` gate — it needs a display — so it
# lives in its own workflow, exactly as the engine legs live in e2e.yml. A single
# Ubuntu job under xvfb.
#
# It also used to need a native-ABI rebuild. It no longer does: better-sqlite3
# (>= 13) and argon2 (>= 0.44) are both Node-API and load unrebuilt under
# Electron. The install-app-deps step below is retained as a no-op — see
# apps/e2e/tests-desktop/helpers/paths.ts for the history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * *' # nightly
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: desktop (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Electron needs the same shared libraries Chromium does to launch headless
      # under xvfb, so this job wants the deps half as much as the browser half.
      # The action installs them best-effort and bounded — see its header for why
      # an unbounded `--with-deps` is what took two required checks down.
      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium
        # Bounds the WHOLE composite action. It cannot live inside the
        # action — `timeout-minutes` is not a legal composite-step key.
        timeout-minutes: 15
        with:
          filter: '@adminium/e2e'

      # Builds the desktop app AND its full dependency graph (dashboard, server,
      # adapters) via the turbo edges.
      - name: Build desktop app
        run: pnpm turbo run build --filter=@adminium/desktop

      # KEPT AS A NO-OP, deliberately. This step existed because a plain
      # electron-vite build does not rebuild better-sqlite3/argon2 for Electron's
      # ABI, and launching the app with a Node-ABI addon crashed the
      # utilityProcess at the meta-store stage. Both addons are Node-API now
      # (better-sqlite3 >= 13, argon2 >= 0.44), so they load under Electron
      # unrebuilt and there is nothing here to fix.
      #
      # Not deleted in the same change that documented it: this job is the ONLY
      # thing that proves the desktop app boots at all, and removing a step that
      # currently passes — on the same commit that changes what the step means —
      # would leave no green signal to attribute a regression to. Delete it in its
      # own commit, with this job green before and after.
      - name: Rebuild native modules (no-op since the N-API bumps)
        run: pnpm --filter @adminium/desktop exec electron-builder install-app-deps

      - name: Run desktop E2E (xvfb)
        run: xvfb-run -a pnpm --filter @adminium/e2e e2e:desktop
        env:
          CI: '1'

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/e2e/test-results-desktop/
            apps/e2e/playwright-report-desktop/
          retention-days: 7
