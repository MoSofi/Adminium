name: desktop-e2e

# 11-T20 (11-electron.md §7 + acceptance criteria): the Playwright `_electron`
# suite that launches the BUILT desktop app and walks first-run → demo → CRUD →
# chart → backup, the §7 offline smoke (session.webRequest deny-all), and the §9
# crash/WAL-durability check.
#
# It cannot run in the ordinary `pnpm test` gate — it needs a display and a
# native-ABI rebuild — so it lives in its own workflow, exactly as the engine
# legs live in e2e.yml. A single Ubuntu job under xvfb; native modules are
# rebuilt for Electron's ABI (electron-builder install-app-deps) between the
# build and the run — see apps/e2e/tests-desktop/helpers/paths.ts for why that
# rebuild is a CI step and not a workspace postinstall.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 3 * * *' # nightly
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: desktop (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` installs the shared system libraries Chromium AND Electron
      # need to launch headless under xvfb.
      - name: Install Playwright + system deps
        run: pnpm --filter @adminium/e2e exec playwright install --with-deps chromium

      # Builds the desktop app AND its full dependency graph (dashboard, server,
      # adapters) via the turbo edges.
      - name: Build desktop app
        run: pnpm turbo run build --filter=@adminium/desktop

      # A plain electron-vite build does NOT rebuild better-sqlite3/argon2 for
      # Electron's ABI; install-app-deps does, against the desktop app's own
      # node_modules. This job runs only Playwright, so rewriting the shared
      # better-sqlite3 copy here is safe (it would break Node-ABI vitest in a
      # shared job — which is why it is not a workspace postinstall).
      - name: Rebuild native modules for Electron's ABI
        run: pnpm --filter @adminium/desktop exec electron-builder install-app-deps

      - name: Run desktop E2E (xvfb)
        run: xvfb-run -a pnpm --filter @adminium/e2e e2e:desktop
        env:
          CI: '1'

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/e2e/test-results-desktop/
            apps/e2e/playwright-report-desktop/
          retention-days: 7
