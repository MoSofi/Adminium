name: nightly

# M0 risk mitigation (M0 risks): a cache misconfiguration in ci.yml could
# hide real breakage behind stale turbo artifacts. This job runs the full
# pipeline nightly with `turbo --force`, ignoring every cache layer.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  full-no-cache:
    name: full-no-cache
    runs-on: ubuntu-latest
    # The server's suite alone is about 35 minutes in ci's own job; at 30 this job was cancelled before it ended.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full build without any turbo cache
        # Two tasks at a time, as the preflight runs them: every package's tests at once starve a four-core runner, and a test then passes its own time limit.
        run: pnpm turbo run lint typecheck build test --force --concurrency=2

      - name: Check dependency graph boundaries
        run: pnpm run check-deps
