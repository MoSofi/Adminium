name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # 40, not 25: the 0.2.9 wave (the app catalogue's 65 new server and dashboard
    # tests) pushed a cache-cold verify past the old ceiling and the job was cut
    # mid-`turbo run test` — GitHub reports that as "cancelled", which reads like
    # somebody pressed a button rather than like a budget. The leg is genuinely
    # long: coverage everywhere, `--concurrency=2`, and TEST_POSTGRES_URL /
    # TEST_MYSQL_URL un-skip the live adapter suites that a laptop never runs.
    # At the cut it had finished dashboard (179 files), server (206) and desktop
    # (18) in 14 minutes and was still inside the remaining packages.
    timeout-minutes: 40
    services:
      # M9 wave-1 follow-up: TEST_MYSQL_URL un-skips the @adminium/adapter-mysql
      # live suite (packages/adapter-mysql/test/harness.ts env gate).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The postgres-gated suites (server crud.test.ts + the
      # adapter-postgres and meta live legs) probe psql on 127.0.0.1:5432 —
      # without this service they skipped green in ci and only e2e.yml
      # exercised postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # The psql harnesses mint throwaway roles and reconnect as them with
          # no password — written for trust-auth local dev. Under the image's
          # default scram auth, libpq falls back to the ambient PGPASSWORD and
          # role logins fail. Trust is fine for an ephemeral CI service.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The licence gate. It runs BEFORE the 20-minute turbo task on purpose: it
      # needs no install and no build, finishes in under a second, and a missing
      # header is the cheapest possible failure to report.
      #
      # It cannot be an ESLint rule — every package's lint script is `eslint src`
      # and there is no root eslint.config.js, so 263 tracked source files
      # (apps/server/test, packages/*/test, scripts/, every vitest.config.ts)
      # are outside any lint invocation. `git ls-files` has no such blind spot.
      # See the header of scripts/check-spdx.mjs.
      #
      # Fix a red run with `pnpm run check-spdx --fix`. If it goes red on a file
      # nobody edited, a code GENERATOR rewrote it without the header — put the
      # SPDX line in that generator's template, never in an exemption list.
      - name: Check SPDX headers
        run: pnpm run check-spdx

      # The work plan this repository was built from lives outside it, and the
      # house convention cited it bare: a document filename, a section, a
      # decision or a task id. To anyone outside the repo those are dead ends,
      # and the short forms do not even name the document. The reasoning that
      # was load-bearing is public now, one page per decision, under
      # /anatomy/decisions/.
      #
      # This is a RATCHET, not a boolean: 16,293 such references across 2,450
      # files remained when it was written, so it holds every file with no
      # baseline entry at zero (all new files, and every file already swept)
      # and lets a recorded count only shrink. Progress must be recorded with
      # `pnpm check-private-citations --update`, which is what stops it being
      # given back.
      #
      # It runs from the root, uncached, for the same reason the two gates
      # below it do: it reads every package, so a per-package task would replay
      # from turbo's cache after a change in a different one.
      - name: Check for citations of documents a reader cannot open
        run: pnpm run check-private-citations

      # Tailwind emits NOTHING for a utility whose token is undefined — no
      # warning, no error — so the element falls back to the CSS initial value
      # and ships looking deliberate. On 2026-09-10 that was thirty call sites
      # across sixteen invented utilities: headings at body size, six cards
      # with `bg-surface-1` and therefore no background at all, black borders
      # from `border-line`, and `text-danger-fg` putting black text on
      # `bg-danger` at 4.01:1 — a WCAG AA failure.
      #
      # Nothing else in this file could have caught it. tsc and eslint do not
      # read the inside of a string, no test or VRT baseline asserts on a class
      # name, and the axe sweep sees contrast only on stories that render the
      # affected state. Runs in under a second, right after SPDX, because the
      # cheap gates go first.
      #
      # It asks Tailwind itself whether each class compiles (see the script
      # header). If it ever goes red on a class you believe is real, the token
      # is missing from packages/tokens/src/tailwind.css — add it there rather
      # than adding an exemption here.
      - name: Check Tailwind utilities compile
        run: pnpm run check-tailwind-utilities

      # The server refuses to BLANK a key that
      # is some control's accessible name, and packages/i18n/src/a11y-keys.ts
      # is the list it refuses from — generated by scanning dashboard, ui,
      # widgets, charts and desktop-renderer source. A key missing from that
      # list fails nothing until an admin empties it and a button loses its only
      # name, so on 2026-09-14 the committed list was 174 keys behind its own
      # generator with every gate green.
      #
      # The package suite runs the same check, but it reads source OUTSIDE
      # @adminium/i18n, which that package's turbo cache key never sees: a
      # dashboard-only change replays the old pass. So it runs here, uncached.
      # About a second; no build needed.
      - name: Check the a11y-critical key list is current
        run: pnpm run a11y-keys-check

      # packages/ui/src/components/icon/icon-core.ts is the set of lucide icons
      # the dashboard's ENTRY chunk imports by name — generated by scanning
      # dashboard, desktop, ui, widgets, charts, engine and llm source for
      # `<Icon name>`, `lucideByName()` and `icon:` literals. A name missing
      # from that set still draws, which is why nothing notices: it shows a
      # placeholder until the whole lucide catalogue has loaded as a lazy chunk
      # (130 KiB gzipped, measured 2026-09-14).
      #
      # @adminium/ui's icon-core.test.ts runs the same `--check`, but six of
      # those seven roots are OUTSIDE @adminium/ui and none is a dependency of
      # it, so that package's turbo cache key never sees them: a dashboard-only
      # change that adds `<Icon name="…">` replays the old pass. So it runs
      # here, uncached, beside the key list above. About 0.3 s; no build
      # needed — it reads source and the installed lucide-react, never a
      # workspace dist.
      - name: Check the core icon set is current
        run: pnpm run icon-core-check

      # The same hole as the two lists above, in ordinary unit tests. Each of
      # these reads a file its own package's turbo key never hashes — a
      # DEPENDENT package's source, or a root file — so after a change confined
      # to that file, the Test step below replays the old pass from the
      # restored cache. Found on 2026-09-14 by tracing every suite's file
      # reads; a grep found nine of the eleven. They include meta's check of the
      # dashboard's RESERVED_GRANTS mirror, i18n's key coverage over every
      # product tree, the server's docs contract, and the fixtures that prove
      # check-offline-assets and generate-notices can fail at all.
      # scripts/check-cross-package-tests.mjs lists each with what it reads.
      #
      # This step runs the five files that touch no workspace dist, not even to
      # probe for one — traced, and run green in a fresh clone with nothing
      # built — so it needs no build; the other six run after Test. About 5 s
      # on a dev box.
      - name: Re-run the tests that read outside their cache key
        run: pnpm run cross-package-tests-check

      # TEST_S3_URL un-skips the `s3` leg of the file-driver conformance
      # suite (apps/server/test/files-drivers.test.ts) — the only place SigV4 is
      # proved against a real S3 implementation rather than against AWS's
      # published vectors. The vectors prove the signing math; MinIO proves
      # interop with a target that actually VERIFIES it. That is why the
      # replacement below is MinIO again and not an S3 mock: a mock that accepts
      # any signature would keep this green while proving nothing.
      #
      # WHY A STEP AND NOT A `services:` CONTAINER. It was one until 2026-09-09,
      # using `bitnami/minio` for the reason the old comment gave: a service
      # container cannot be given a command, the upstream image needs
      # `server /data`, and Bitnami's started from environment alone and created
      # the bucket via MINIO_DEFAULT_BUCKETS. Bitnami then emptied their free
      # Docker Hub catalog — `bitnami/minio` now has ZERO tags and every run
      # failed on `manifest for bitnami/minio:latest not found`, so no pin could
      # rescue it. The surviving `bitnamilegacy/minio` is an explicitly
      # unsupported shelf frozen at 2025-08, i.e. the same failure again later.
      # A step has none of the service block's limits: it can pass the command,
      # so it runs the upstream image, which is the maintained one.
      #
      # The readiness probe runs on the RUNNER rather than as a container
      # `--health-cmd`: the upstream image is UBI-micro based and is not
      # guaranteed to carry curl, and a health check that cannot execute reports
      # unhealthy forever.
      #
      # FROM quay.io, NOT DOCKER HUB. On 2026-09-13 `minio/minio` stopped
      # existing on Docker Hub (repository 404, "pull access denied"), so this
      # step exited 125 and `verify` ran nothing. quay.io is MinIO's own registry
      # and carries this exact pinned tag, so the pin did not move, only where it
      # is pulled from.
      - name: Start MinIO (the S3 conformance target)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::MinIO did not become ready; logs follow"
              docker logs minio || true
              exit 1
            fi
            sleep 2
          done
          # The suite reads the bucket out of TEST_S3_URL and does NOT create it
          # (files-drivers.test.ts:118). MINIO_DEFAULT_BUCKETS did this before;
          # the AWS CLI is preinstalled on ubuntu-latest, so nothing new is
          # fetched to replace it.
          AWS_ACCESS_KEY_ID=minioadmin \
          AWS_SECRET_ACCESS_KEY=minioadmin \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://adminium-test

      # Build at full concurrency, then run the SUITES with turbo bounded to two
      # tasks at a time. The split is the fix for a flake, and the reason is
      # measured rather than guessed.
      #
      # `packages/config/vitest/index.js` already caps each vitest pool at 50% of
      # the machine — but a per-pool cap cannot see the OTHER pools. Eighteen
      # packages have a vitest script and turbo's default concurrency is 10, so
      # the runner ran several full pools at once, each believing it owned the
      # CPU. Measured on an 8-core box with `turbo run test --force`: peak 28
      # concurrent vitest processes at the default, 18 with
      # ADMINIUM_TEST_WORKERS=1, and 10 at `--concurrency=2`.
      #
      # On a 4-vCPU runner that oversubscription is what reddened `verify`: the
      # dashboard suite took 790-900 s against 59 s standalone, and two of its
      # 1654 tests failed on `findBy*` budgets — DIFFERENT tests on each attempt,
      # which is the signature of starvation rather than a broken assertion.
      # `studioSettingsPage.test.tsx` needs only 200-500 ms of async budget on an
      # idle machine against a 5,000 ms allowance, i.e. a 10x margin that CI
      # exhausted.
      #
      # NOT a timeout bump: `workers()`'s own docblock records that raising the
      # budget did not hold last time and warns that "a timeout raised to outrun
      # the scheduler stops measuring the thing it was written to measure". This
      # removes the contention instead.
      #
      # It is also FASTER, which is why 2 and not 1: bounding concurrency took
      # the dashboard suite from 156 s to 106 s in the same measurement, because
      # the machine stops thrashing. ADMINIUM_TEST_WORKERS=1 was the slowest of
      # the three (269 s) — fewer workers per pool, but no cross-pool bound.
      - name: Lint, typecheck, build
        run: pnpm turbo run lint typecheck build

      - name: Test
        run: pnpm turbo run test --concurrency=2
        env:
          TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          # The grammar is `http://<key>:<secret>@<host>/<bucket>`; the suite
          # prints "SKIPPED (TEST_S3_URL is not set)" by name when it is
          # absent, so a leg that stops running says so instead of vanishing.
          TEST_S3_URL: http://minioadmin:minioadmin@127.0.0.1:9000/adminium-test
          # The psql-driven harnesses (apps/server + adapter-postgres) shell out
          # to `psql -h 127.0.0.1` and authenticate from the ambient PG env.
          PGUSER: postgres
          PGPASSWORD: postgres

      # The coverage floors live in each package's vitest.config.ts. When one
      # fails, vitest's error names the package and the axis but not the file that
      # dropped — coverage-summary.json does, per file. Uploaded on failure only:
      # a green run's report is restorable from the turbo cache and nobody reads
      # it.
      - name: Upload coverage summaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7
          if-no-files-found: ignore

      # The other six cross-package tests (see the step before MinIO). These
      # need built workspace packages, so they run once the build has. Among
      # them: the Docker distribution contract, which pins the ROOT Dockerfile,
      # compose file and workflows, and the desktop demo's acceptance test,
      # which seeds with apps/desktop's real script from inside the server
      # suite. Neither file is in apps/server's key. Placed after the coverage
      # upload on purpose: that step is for the suites above, and a red here
      # should not trigger it. About 6 s on a dev box.
      - name: Re-run the tests that read outside their cache key (built)
        run: pnpm run cross-package-dist-tests-check

      # The desktop build must work with the network cable
      # unplugged, forever. `desktop#build` already chains this (see that
      # package's //scripts note), but a turbo CACHE HIT skips the whole task —
      # so this step re-runs it unconditionally against the restored outputs.
      # Named separately for the same reason check-deps is: when it fails, the
      # failure should say what broke, not "build".
      - name: Check offline assets
        run: pnpm run check-offline-assets

      # The mail renderer and the builder canvas both read
      # `adminium_email_templates.blocks`, from two lists that no import can
      # hold together (the server may not import @adminium/widgets, 01 2.3).
      # They were disjoint on every install until 2026-08-29 and CI never
      # noticed: a kind one side doesn't know is SKIPPED, not thrown on, so the
      # symptom was a blank editor and a blank email, never a red build.
      # Named separately so the failure says which list moved.
      - name: Check email block vocabulary
        run: pnpm run check-email-block-vocab

      # Two vocabularies, three trees, one gate:
      # the same shape as the email gate above, with one difference the header
      # of scripts/check-invoice-block-vocab.mjs spells out — the renderer of
      # the authored body lives in ANOTHER repository (the invoices add-on),
      # so the 27 kinds cross the boundary as data and every copy is held
      # equal to it. Named separately so the failure says which copy moved.
      - name: Check invoice block vocabulary
        run: pnpm run check-invoice-block-vocab

      # The arithmetic law is a COPY
      # in each tree that computes money (the editor's ladder, the summary the
      # server writes, the add-on's renderer), and each tree's test proves its
      # copy against its own money-fixture.json — so the fixtures themselves
      # must be byte-identical, or a tree whose table was edited alone goes
      # green on a law the other trees no longer share. Named separately so
      # the failure names the copy to overwrite.
      - name: Check invoice money fixture
        run: pnpm run check-invoice-money-fixture

      # Every /api/v1 route declares a zod schema, so the
      # OpenAPI document is DERIVED from the route tree rather than written by
      # hand — and a derived artifact that nobody regenerates is a stale
      # contract published as a current one. This composes the real server
      # (apps/server/scripts/openapi.mjs) and fails when the emitted spec
      # differs from the committed apps/server/openapi.json. Same shape as the
      # allow-list and translation gates above; it runs after the build step
      # because it imports the server's dist.
      - name: Check OpenAPI spec is current
        run: pnpm run openapi-check

      # The published CLI carries its internal packages inside its tarball and
      # declares the third-party packages they load, from a list traced out of
      # the built code. A new import in an internal package makes that list
      # stale; this fails here, not at release time. It reads dist, so it runs
      # after the build.
      - name: Check the CLI's runtime dependency list is current
        run: pnpm run server-runtime-deps-check

      # The two artifacts DERIVED from that spec and from the IR model. Both
      # exist because the docs published contracts nobody generated: the REST
      # reference omitted 52 of 161 operations under a heading that read as
      # complete, and `guides/schema-import/json-ir.md` had advertised a
      # `$schema` URL since it was written that 404'd. Generating them is half a
      # fix — a derived artifact nobody re-derives is a stale contract published
      # as a current one, which is the same failure `openapi-check` above exists
      # for. `docs-contract.test.ts` and `engine/test/ir-json-schema.test.ts`
      # assert the same things from the other side; these run here so the
      # failure names the command that fixes it.
      - name: Check the published IR JSON Schema is current
        run: pnpm run ir-schema-check

      # The schemas a project's page and schema files name with `$schema`,
      # generated from the server's file schemas (reads dist).
      - name: Check the published project file schemas are current
        run: pnpm run project-schemas-check

      - name: Check the REST reference covers the route tree
        run: pnpm run rest-api-docs-check

      # This gate has existed as a package script since M8 and was never wired
      # into CI, so translation drift — a bundle whose en-US source moved under
      # it — could land unnoticed. It matters more now: once an admin can
      # override a string at runtime, the build-time gates are the ONLY place
      # several of these guarantees can still be checked at all.
      #
      # `check` regenerates src/review-status.ts as a side effect, so the
      # working tree is verified clean afterwards: a diff means someone
      # changed a bundle without regenerating, which is exactly the drift the
      # gate exists to catch.
      - name: Check translation drift
        run: |
          pnpm run i18n-check
          git diff --exit-code -- packages/i18n/src/review-status.ts

      # The desktop build must ship a licence notice for every
      # bundled dependency. `desktop#build` chains this too, but a turbo CACHE HIT
      # skips the whole task — so, like the offline gate above, re-run it here
      # unconditionally. It FAILS on a bundled package that carries no licence.
      - name: Generate third-party notices
        run: pnpm run generate-notices

      # The icons are a DELIVERABLE derived by a script, not a
      # checked-in binary — and their outputs are .gitignored, so nothing else in
      # CI ever executes that script. It was previously exercised only by
      # desktop-release.yml's `Generate app icons` step, i.e. only on a
      # `desktop-v*` tag, i.e. never: the script sat broken (icon-gen v1-era
      # options against icon-gen v5) and would have failed the FIRST step of all
      # three OS legs on the first real release. Run it here, on every push, so a
      # dep bump that shifts icon-gen's option shape or sharp's API is caught by
      # the cheap gate instead of by a tag. It needs no secrets and no display;
      # `icons`'s own `loadDesktopDep` also asserts that sharp + icon-gen really
      # are linked into apps/desktop by a frozen install, which is the other half
      # of what the release step depends on.
      - name: Derive desktop icons (release-path smoke)
        run: pnpm --filter @adminium/desktop run icons

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    # Storybook build + ~1100 axe runs; slower than `verify`, hence its own job
    # so it neither blocks nor is blocked by the main gate.
    #
    # 45, raised from 30: the sweep now navigates with `networkidle` so it waits
    # for each widget family's lazily-imported body instead of scanning an empty
    # frame (see scripts/a11y-sweep.mjs). That is worth up to ~0.5s per
    # navigation across 1,096 runs, and the previous run took 11.5 minutes.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium
        # Bounds the WHOLE composite action. It cannot live inside the
        # action — `timeout-minutes` is not a legal composite-step key.
        timeout-minutes: 15
        with:
          filter: '@adminium/ui'

      # Storybook's Vite resolves the workspace packages it imports
      # (@adminium/tokens, @adminium/widgets, …) from their built `dist`, which a
      # fresh checkout does not have — so `build-storybook` fails with "Failed to
      # resolve entry for package @adminium/tokens" without this. `verify` gets
      # away without an explicit build only because its combined turbo task
      # builds as a dependency; this job runs the sweep alone.
      - name: Build workspace dists
        run: pnpm turbo run build

      # WHY THIS JOB EXISTS. The axe sweep has existed since M0-M4 and nothing
      # ever ran it. It went red as the M7 widget families landed and stayed red,
      # unnoticed, until 554 critical/serious violations had accumulated — a gate
      # that runs nowhere is not a gate. It now RATCHETS against the committed
      # packages/ui/a11y-baseline.json: the count may fall, never rise. That
      # fails the build on the first NEW violation, which is the property that
      # was missing, without demanding the whole backlog be cleared first.
      #
      # Lower the baseline with `pnpm --filter @adminium/ui a11y --update-baseline`
      # whenever you fix violations; the file is committed so it shows up in review.
      - name: Axe sweep (ratchet)
        run: pnpm --filter @adminium/ui a11y

  vrt:
    name: vrt
    runs-on: ubuntu-latest
    # Storybook build + a screenshot matrix; own job for the same reason `a11y`
    # has one.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # THE BASELINE CHECK RUNS FIRST, and that ordering is the point.
      #
      # It used to run last, after a dependency install, a browser install and a
      # full workspace build — two to four minutes of work (measured across the
      # green vrt jobs of 2026-08-18: 1m55s to 4m34s) to reach a step whose only
      # action, at zero baselines, is to print a warning and exit 0. On
      # 2026-08-18 the browser install stalled on an apt mirror and this job ran
      # to its timeout, which set the WHOLE `ci` run's conclusion to `cancelled`
      # while verify, a11y and dep-graph had all passed. A job that cannot detect
      # anything was the only reason main had no green run — and `vrt` is not
      # even a required check.
      #
      # Deciding whether there is anything to do costs one `ls`. Do that before
      # spending anything.
      - name: Look for committed baselines
        id: baselines
        run: |
          shopt -s nullglob
          baselines=(packages/ui/vrt/__screenshots__/*.png)
          echo "count=${#baselines[@]}" >> "$GITHUB_OUTPUT"
          echo "Found ${#baselines[@]} committed baseline(s)."

      # The toolchain is set up ONLY if there is work. `actions/setup-node` with
      # `cache: pnpm` registers a post-job step that saves the pnpm store — and
      # with the install skipped there is no store, so that post step failed and
      # took the whole job red. A job that short-circuits has to short-circuit
      # BEFORE the thing with a post-action, not after it.
      - name: Set up pnpm
        if: steps.baselines.outputs.count != '0'
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        if: steps.baselines.outputs.count != '0'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Report the empty baseline set
        if: steps.baselines.outputs.count == '0'
        run: |
          {
            echo "### VRT: no baselines committed"
            echo
            echo "\`packages/ui/vrt/__screenshots__/\` is empty, so there is nothing to"
            echo "compare against and this job cannot detect a visual regression."
            echo
            echo "Capture them by running the **vrt-baselines** workflow on this branch,"
            echo "then commit the uploaded PNGs **as a complete set** — a partial set"
            echo "fails this job on every story that still lacks one, by design."
            echo "RELEASE-GATE.md's VRT row stays unchecked until that happens."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=VRT has no baselines::The visual-regression matrix has 0 committed screenshots, so it cannot detect a regression. See the job summary."

      # `success() &&` is load-bearing: an explicit `if:` REPLACES the implicit
      # `success()`, so without it a failure in the baseline step above would
      # leave `count` unset, `'' != '0'` would evaluate true, and the expensive
      # path would run anyway. Fail closed.
      - name: Install dependencies (frozen lockfile)
        if: success() && steps.baselines.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        if: success() && steps.baselines.outputs.count != '0'
        uses: ./.github/actions/playwright-chromium
        # Bounds the WHOLE composite action. It cannot live inside the
        # action — `timeout-minutes` is not a legal composite-step key.
        timeout-minutes: 15
        with:
          filter: '@adminium/ui'

      # Same reason as the a11y job: storybook's Vite resolves the workspace
      # packages from their built `dist`.
      - name: Build workspace dists
        if: success() && steps.baselines.outputs.count != '0'
        run: pnpm turbo run build

      # WHY THIS JOB EXISTS. The VRT harness — spec, config, profile matrix,
      # determinism hooks — has been complete since M1 and appeared in no
      # workflow and no turbo task. It had never run once, so it could not fail,
      # and RELEASE-GATE.md carried a row about regenerating its baselines that
      # nothing was measuring. A harness nobody runs is not a gate; it is a file
      # that looks like one.
      #
      # Baselines are LINUX-canonical (playwright.config.ts header) and there are
      # currently zero of them, deliberately: the audit's sequencing is to record
      # them AFTER the accessibility burn-down settles, or the whole matrix gets
      # recorded twice. Until then the steps above report the empty state and skip
      # the expensive ones; from the first committed PNG this runs for real and
      # fails on drift. Capture them with the `vrt-baselines` workflow
      # (workflow_dispatch), which runs on this same image and uploads the PNGs
      # for review.
      #
      # BASELINES MUST BE COMMITTED AS A COMPLETE SET, and that is not a policy
      # choice — it is what Playwright does. Measured on 1.62.1 with CI=1:
      #
      #   no baselines,  plain run  -> writes the PNG and FAILS ("A snapshot
      #                                doesn't exist ... writing actual")
      #   no baselines, --update-snapshots=missing
      #                             -> identical: writes AND fails. The flag does
      #                                not rescue this; an earlier draft of this
      #                                job used it and said otherwise.
      #   partial set,   plain run  -> passes the stories that have one, fails
      #                                every story that does not
      #   complete set,  plain run  -> passes
      #   any state,   --update-snapshots=all
      #                             -> rewrites everything and passes
      #   any state,   --update-snapshots
      #                             -> same (preset "changed"); this is what
      #                                `vrt:update` and the vrt-baselines
      #                                workflow run, which is why capture is
      #                                green while this job is not
      #
      # So committing "just the screenshots I have reviewed" turns this job red,
      # and that is the correct behaviour rather than a rough edge: a baseline
      # recorded silently is an unreviewed baseline, and a gate that accepts one
      # is the fingerprint-baseline mistake in a second form.
      #
      # For a MISSING baseline the failure is also the capture mechanism:
      # Playwright writes the actual PNG on the way to failing, and the step below
      # uploads the screenshot directory, so a red run hands you the file to
      # review and commit. That does NOT apply to DRIFT — a story whose committed
      # baseline no longer matches fails without overwriting it, which is the
      # whole point. For drift, read the HTML report artifact instead.
      - name: Visual regression matrix
        if: success() && steps.baselines.outputs.count != '0'
        run: |
          echo "Comparing against ${{ steps.baselines.outputs.count }} committed baseline(s)."
          pnpm --filter @adminium/ui vrt

      # Uploads the WHOLE screenshot directory — committed baselines plus any
      # the run had to write — because that is what the step can cheaply do; it
      # is not a diff of new files, and the name says so. Compare against the
      # tree to find what changed. `if: always()` because this matters most on
      # the run that also failed on a different story's drift.
      - name: Upload the screenshot directory
        if: always() && steps.baselines.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: vrt-new-baselines
          path: packages/ui/vrt/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload VRT report
        if: failure() && steps.baselines.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report
          path: packages/ui/playwright-report
          retention-days: 7

  dep-graph:
    name: dep-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # dependency-cruiser resolves workspace subpath exports (e.g.
      # @adminium/engine/config) through each package's dist-backed exports
      # map. Without built dists those specifiers fall back to the package
      # root and read as full-barrel imports — 4 false dashboard-no-full-engine
      # violations on this job's first-ever run. Build first; the graph being
      # checked is the one consumers actually resolve.
      - name: Build workspace dists
        run: pnpm turbo run build

      - name: Check dependency graph boundaries
        run: pnpm run check-deps
