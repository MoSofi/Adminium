# Render Blueprint — Adminium as a Docker web service with a persistent disk for
# the embedded SQLite meta store. Render injects PORT and Adminium honors it
# (apps/server/src/config/env.ts). `generateValue: true` mints ADMINIUM_SECRET
# once and keeps it stable across deploys — the one property the meta store's
# encryption depends on.
#
# To deploy: create a Blueprint from the repo, or use the Deploy-to-Render button
# in the top-level README. For an external Postgres/MySQL meta store, set
# ADMINIUM_META_URL, and keep the `disk:` block anyway: installed apps and
# add-ons are stored on it too, and without it every deploy loses them
# (deploy/README.md, "Apps and add-ons on a host with no disk").
#
# DRAFT: authored against the published image; not yet validated by a live
# Render deploy (workplan / owner step).
services:
  - type: web
    name: adminium
    runtime: image
    image:
      url: ghcr.io/mosofi/adminium:latest
    plan: starter
    healthCheckPath: /api/v1/readyz
    envVars:
      - key: ADMINIUM_SECRET
        generateValue: true
      - key: ADMINIUM_DATA_DIR
        value: /data
    # The disk is also where files land: uploads, record attachments, export
    # artifacts, the branding logo and imported schema files are written under
    # /data/files, with nothing to configure. 1 GB is a starting size, not a
    # ceiling — raise sizeGB, or send the bytes elsewhere by setting
    # ADMINIUM_STORAGE_URL to an S3-compatible bucket or a WebDAV server when
    # the disk is no longer the right home for them. Installed apps and add-ons
    # are kept under /data/apps and /data/add-ons, and only the disk can hold
    # them.
    disk:
      name: adminium-data
      mountPath: /data
      sizeGB: 1
