# Render Blueprint — Adminium as a Docker web service with a persistent disk for
# the embedded SQLite meta store. Render injects PORT and Adminium honors it
# (apps/server/src/config/env.ts). `generateValue: true` mints ADMINIUM_SECRET
# once and keeps it stable across deploys — the one property the meta store's
# encryption depends on.
#
# To deploy: create a Blueprint from the repo, or use the Deploy-to-Render button
# in the top-level README. For an external Postgres/MySQL meta store, set
# ADMINIUM_META_URL, and keep the `disk:` block anyway: installed apps and
# add-ons are stored on it too, and without it every deploy loses them
# (deploy/README.md, "Apps and add-ons on a host with no disk").
#
# DRAFT: authored against the published image; not yet validated by a live
# Render deploy (workplan / owner step).
services:
  - type: web
    name: adminium
    runtime: image
    image:
      # An exact version, never `latest` (deploy/README.md): a Blueprint redeploy
      # resolves the tag again, so `latest` upgrades the engine — and migrates the
      # meta store — on a deploy you triggered for something else. Bump it here.
      url: ghcr.io/mosofi/adminium:0.3.36
    # standard (2 GB). This number is the limit on THIS CONTAINER: Render's
    # orchestrator, the container runtime and the TLS edge run outside it.
    # Adminium holds ~245 MB of heap from boot and the image gives Node a 512 MB
    # heap ceiling, which needs about 1 GB behind it; Render has no 1 GB plan,
    # and starter's 512 MB is not enough (Node then picks a ~256 MB ceiling,
    # which a few hours of use fill). Raise it further for a large schema.
    plan: standard
    healthCheckPath: /api/v1/readyz
    envVars:
      - key: ADMINIUM_SECRET
        generateValue: true
      - key: ADMINIUM_DATA_DIR
        value: /data
      # Render terminates TLS at its router and forwards plain HTTP to the
      # service, so without this Adminium reads every request as insecure and
      # sourced from the router: `request.protocol` is `http`
      # (apps/server/src/auth/sessions.ts, `isSecureRequest`), the session cookie
      # is set WITHOUT `Secure`, the audit log records the router instead of the
      # client, and every per-IP rate limit shares one bucket. Safe here because
      # the service port is reachable only through that router.
      #
      # Quoted: unquoted `on` is a YAML 1.1 boolean, and the variable is a strict
      # `on|off|true|false|1|0` enum. ADMINIUM_TRUSTED_PROXIES is left at its
      # default, `loopback,uniquelocal`, which covers the private address the
      # router connects from; setting that list while this is off stops the boot.
      - key: ADMINIUM_TRUST_PROXY
        value: 'on'
    # The disk is also where files land: uploads, record attachments, export
    # artifacts, the branding logo and imported schema files are written under
    # /data/files, with nothing to configure. 1 GB is a starting size, not a
    # ceiling — raise sizeGB, or send the bytes elsewhere by setting
    # ADMINIUM_STORAGE_URL to an S3-compatible bucket or a WebDAV server when
    # the disk is no longer the right home for them. Installed apps and add-ons
    # are kept under /data/apps and /data/add-ons, and only the disk can hold
    # them.
    disk:
      name: adminium-data
      mountPath: /data
      sizeGB: 1
