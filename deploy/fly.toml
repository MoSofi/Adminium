# Fly.io — Adminium on a persistent volume holding the embedded SQLite meta
# store, files, and backups. Fly routes to `internal_port`; Adminium defaults to
# 4600, so no PORT juggling is needed.
#
# ADMINIUM_SECRET is NOT in this file on purpose — secrets never belong in a
# committed manifest. Set it once, before the first deploy, and never change it
# (changing it makes every stored DSN and API key undecryptable):
#
#   fly volumes create adminium_data --size 1
#   fly secrets set ADMINIUM_SECRET=$(openssl rand -hex 32)
#   fly deploy
#
# DRAFT: authored against the published image; not yet validated by a live Fly
# deploy (workplan 17-T17 / owner step).
app = "adminium"
primary_region = "iad"

[build]
  image = "ghcr.io/mosofi/adminium:latest"

[env]
  ADMINIUM_DATA_DIR = "/data"

# Uploads, record attachments, export artifacts, the branding logo and imported
# schema files land under /data/files on this volume, with nothing to configure.
# Know what that buys you: a Fly volume is attached to ONE machine in ONE region
# and is not replicated, so it is durable for the single-machine app this file
# describes (min_machines_running = 1) and no further. Scale to a second machine
# and each one has its own separate volume and its own separate files.
#
# For anything beyond that, `fly storage create` provisions a Tigris bucket and
# writes AWS_ENDPOINT_URL_S3, AWS_REGION, BUCKET_NAME, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY into the app's secrets. Adminium's first-boot storage
# seed (apps/server/src/config/storage-seed.ts) reads exactly those five when
# ADMINIUM_STORAGE_URL is unset, so no further configuration is needed. They are
# also the only AWS_* variables Adminium reads anywhere: nothing else in the
# server picks up ambient AWS credentials.
[[mounts]]
  source = "adminium_data"
  destination = "/data"

[http_service]
  internal_port = 4600
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
  method = "get"
  path = "/api/v1/readyz"
