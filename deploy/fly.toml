# Fly.io — Adminium on a persistent volume holding the embedded SQLite meta
# store, files, installed apps and add-ons, and backups. Fly routes to
# `internal_port`; Adminium defaults to 4600, so no PORT juggling is needed.
#
# ADMINIUM_SECRET is NOT in this file on purpose — secrets never belong in a
# committed manifest. Set it once, before the first deploy, and never change it
# (changing it makes every stored DSN and API key undecryptable):
#
#   fly volumes create adminium_data --size 1
#   fly secrets set ADMINIUM_SECRET=$(openssl rand -hex 32)
#   fly deploy
#
# DRAFT: authored against the published image; not yet validated by a live Fly
# deploy (workplan / owner step).
app = "adminium"
primary_region = "iad"

# An exact version, never `latest` (deploy/README.md). Fly resolves the image at
# deploy time, so with `latest` an unrelated redeploy months later pulls whatever
# it points at then and migrates the meta store to it. Bump this when you upgrade.
[build]
  image = "ghcr.io/mosofi/adminium:0.3.36"

# Fly terminates TLS at its edge and forwards to `internal_port` over the private
# 6PN network, so every request reaches Adminium as plain HTTP from the
# fly-proxy. WITHOUT ADMINIUM_TRUST_PROXY that is taken at face value:
# `request.protocol` is `http` (apps/server/src/auth/sessions.ts,
# `isSecureRequest`), so the session cookie is set WITHOUT `Secure`, the audit
# log records the proxy's address instead of the client's, and every per-IP rate
# limit shares one bucket. It is safe to turn on here because the machine's port
# is reachable only through that proxy.
#
# ADMINIUM_TRUSTED_PROXIES is deliberately left at its default,
# `loopback,uniquelocal`: `uniquelocal` covers `fc00::/7`, which is where Fly's
# `fdaa::/16` internal network lives. Narrowing it to the fly-proxy is not
# possible — its address is not fixed — so any machine in this Fly org that can
# reach the app over 6PN can forge a client address. Do not set the list without
# the line above it: a list with trust off stops the boot, on purpose.
[env]
  ADMINIUM_DATA_DIR = "/data"
  ADMINIUM_TRUST_PROXY = "on"

# Uploads, record attachments, export artifacts, the branding logo and imported
# schema files land under /data/files on this volume, with nothing to configure.
# Know what that buys you: a Fly volume is attached to ONE machine in ONE region
# and is not replicated, so it is durable for the single-machine app this file
# describes (min_machines_running = 1) and no further. Scale to a second machine
# and each one has its own separate volume and its own separate files.
#
# For anything beyond that, `fly storage create` provisions a Tigris bucket and
# writes AWS_ENDPOINT_URL_S3, AWS_REGION, BUCKET_NAME, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY into the app's secrets. Adminium's first-boot storage
# seed (apps/server/src/config/storage-seed.ts) reads exactly those five when
# ADMINIUM_STORAGE_URL is unset, so no further configuration is needed. They are
# also the only AWS_* variables Adminium reads anywhere: nothing else in the
# server picks up ambient AWS credentials.
[[mounts]]
  source = "adminium_data"
  destination = "/data"

# Stated explicitly rather than left to Fly's default, which has changed between
# versions of flyctl and is not something a deployment should inherit.
#
# 1 GB. A Fly Machine is a micro-VM running this container and a small init —
# no container daemon and no proxy in here, because Fly terminates TLS at its
# edge — so the memory is the server's own. Adminium holds ~245 MB of heap from
# boot and the image gives Node a 512 MB heap ceiling; 1 GB backs it. 512 MB is
# not enough: Node then picks a ~256 MB ceiling, which a few hours of use fill,
# and a Fly Machine has no swap. (The 2 GB the docs ask for is for a machine where
# YOU run the runtime and a proxy beside the server.) Raise it for a large schema.
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[http_service]
  internal_port = 4600
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"
  method = "get"
  path = "/api/v1/readyz"
