# DigitalOcean App Platform — Adminium as a container with a MANAGED Postgres as
# the meta store. App Platform containers have no persistent local disk, so the
# embedded SQLite store would be wiped on every deploy (workplan 17 §7.3); the
# managed database's connection string is bound to ADMINIUM_META_URL natively via
# ${adminium-meta.DATABASE_URL} — DigitalOcean's own binding token for that
# database, not an Adminium variable. ADMINIUM_SOURCE_URL, which IS one (the
# first-boot source-connection seed), is deliberately NOT set: the meta database
# must never also be imported as a source connection. Set it only if you have a
# separate application database you want a back office for.
#
# THE MISSING DISK COSTS YOU FILES TOO, and that is a SECOND thing to set.
# Uploads, record attachments, export artifacts, the branding logo and imported
# schema files are all written through one storage seam (37-files-and-storage.md
# §3.1), which defaults to ADMINIUM_DATA_DIR/files — a directory that does not
# survive a redeploy here. A storage destination is therefore REQUIRED on App
# Platform, not optional, and it must exist before the first boot. Create a
# Space (and, if you want CDN URLs, enable its CDN), then add a second
# encrypted app-level secret:
#
#   ADMINIUM_STORAGE_URL=s3://<space>?endpoint=https://<region>.digitaloceanspaces.com&region=<region>&pathStyle=0&accessKey=...&secretKey=...
#
# optionally with &publicBaseUrl=https://<space>.<region>.cdn.digitaloceanspaces.com
# so a stored reference in your own table points at the CDN. It is read ONCE,
# on a boot where no destination is configured, and ignored on every boot
# after; a destination you later edit in Studio wins. It is deliberately absent
# from `envs` below because its value carries a credential — set it in the App
# Platform UI or with `doctl`, as an encrypted secret, exactly like
# ADMINIUM_SECRET.
#
# App Platform declares the listening port with `http_port` and sets PORT to
# match; Adminium honors PORT. ADMINIUM_SECRET must be set as an encrypted
# app-level secret before the first deploy and kept stable (changing it makes
# every stored secret undecryptable).
#
# DRAFT: authored against the published image; not yet validated by a live App
# Platform deploy (workplan 17-T17 / owner step).
spec:
  name: adminium
  services:
    - name: adminium
      image:
        registry_type: GHCR
        registry: mosofi
        repository: adminium
        tag: latest
      http_port: 4600
      instance_size_slug: basic-xxs
      instance_count: 1
      health_check:
        http_path: /api/v1/readyz
      envs:
        - key: ADMINIUM_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: ADMINIUM_META_URL
          scope: RUN_TIME
          value: ${adminium-meta.DATABASE_URL}
  databases:
    - name: adminium-meta
      engine: PG
      production: false
